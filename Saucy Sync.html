ost\" style=\"flex:none\" sc-camel-on-click=\"{{ goAutoSync }}\">Fan-out rules<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isToday }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"Command center — Today\" style=\"display:flex; flex-direction:column; gap:17.6px; max-width:860px\">\n          <div class=\"seg\" style=\"align-self:flex-start; flex:none\">\n            <sc-for list=\"{{ dashTabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n              <label class=\"seg-opt\" style=\"background:{{ t.bg }}; color:{{ t.fg }}\">\n                <input type=\"radio\" name=\"dashtab\" sc-camel-on-change=\"{{ t.pick }}\">\n                <span>{{ t.label }}<\u002Fspan>\n              <\u002Flabel>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div>\n            <span style=\"font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700)\">{{ todayDate }}<\u002Fspan>\n            <h1 style=\"font-family:var(--font-heading); font-weight:400; font-size:40px; line-height:1.15; margin:6px 0 0\">The day in one page<\u002Fh1>\n            <p style=\"margin:10px 0 0; font-size:15.5px; line-height:1.6; color:var(--color-neutral-700)\">{{ todayLede }}<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:13.2px\">\n            <sc-for list=\"{{ todayNumbers }}\" as=\"n\" hint-placeholder-count=\"4\">\n              <div style=\"background:var(--color-surface); border-radius:28px; padding:20px; display:flex; flex-direction:column; gap:4px\">\n                <span style=\"font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700)\">{{ n.label }}<\u002Fspan>\n                <span style=\"font-family:var(--font-heading); font-weight:400; font-size:34px; line-height:1.25\">{{ n.value }}<\u002Fspan>\n                <span style=\"font-size:12.5px; color:var(--color-neutral-700)\">{{ n.note }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px\">\n            <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">What happened<\u002Fh2>\n            <p style=\"margin:0 0 8.8px; font-size:13.5px; color:var(--color-neutral-700)\">Handled without you unless it says otherwise.<\u002Fp>\n            <sc-for list=\"{{ todayEvents }}\" as=\"e\" hint-placeholder-count=\"6\">\n              <div style=\"display:flex; gap:14px; padding:12px 0; border-top:1px solid var(--color-neutral-300); align-items:flex-start\">\n                <span style=\"width:34px; height:34px; flex:none; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; background:{{ e.dotBg }}; color:{{ e.dotFg }}\">{{ e.badge }}<\u002Fspan>\n                <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:2px\">\n                  <span style=\"font-size:14.5px; font-weight:600\">{{ e.what }}<\u002Fspan>\n                  <span style=\"font-size:12.5px; line-height:1.45; color:var(--color-neutral-700)\">{{ e.detail }}<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-family:ui-monospace, monospace; font-size:11.5px; color:var(--color-neutral-600); flex:none\">{{ e.time }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:{{ showTodayOps }}; flex-direction:column; background:var(--color-surface); border-radius:28px; padding:26.4px\">\n            <div style=\"display:flex; align-items:baseline; gap:10px; margin-bottom:4px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0; font-size:24px\">Left for you<\u002Fh2>\n              <span class=\"tag {{ todayLeftTag }}\">{{ todayLeftCount }}<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 8.8px; font-size:13.5px; color:var(--color-neutral-700)\">{{ todayLeftNote }}<\u002Fp>\n            <sc-for list=\"{{ decisions }}\" as=\"d\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex; align-items:center; gap:13.2px; padding:12px 0; border-top:1px solid var(--color-neutral-300); flex-wrap:wrap\">\n                <div style=\"flex:1; min-width:180px; display:flex; flex-direction:column; gap:2px\">\n                  <span style=\"font-size:14.5px; font-weight:600\">{{ d.title }}<\u002Fspan>\n                  <span style=\"font-size:12.5px; line-height:1.4; color:var(--color-neutral-700)\">{{ d.detail }}<\u002Fspan>\n                <\u002Fdiv>\n                <button class=\"btn btn-secondary\" style=\"flex:none; padding:8px 16px; font-size:13px\" sc-camel-on-click=\"{{ d.act }}\">{{ d.action }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ decisionsClear }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border-top:1px solid var(--color-neutral-300); padding:26.4px 0 4px; text-align:center\">\n                <span style=\"font-family:var(--font-heading); font-weight:400; font-size:22px\">Nothing. Close the laptop.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px; display:flex; align-items:center; gap:17.6px; flex-wrap:wrap\">\n            <div style=\"flex:1; min-width:200px; display:flex; flex-direction:column; gap:3px\">\n              <span style=\"font-family:var(--font-heading); font-weight:400; font-size:22px\">Tomorrow<\u002Fspan>\n              <span style=\"font-size:13.5px; line-height:1.5; color:var(--color-neutral-700)\">{{ tomorrowNote }}<\u002Fspan>\n            <\u002Fdiv>\n            <button class=\"btn btn-ghost\" style=\"flex:none\" sc-camel-on-click=\"{{ goSocial }}\">See the week<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isAddPlatform }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"Add a platform\" style=\"display:flex; flex-direction:column; gap:17.6px\">\n          <div>\n            <h1 style=\"font-family:var(--font-heading); font-weight:400; font-size:36px; line-height:1.15; margin:0\">Add a platform<\u002Fh1>\n            <p style=\"margin:8px 0 0; font-size:15px; line-height:1.55; color:var(--color-neutral-700); max-width:66ch\">Connect anywhere else you sell or make. It joins the same catalog, the same order queue and the same fan-out rules — no second system to keep in step.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:17.6px\">\n            <sc-for list=\"{{ platformCatalog }}\" as=\"p\" hint-placeholder-count=\"6\">\n              <div style=\"background:var(--color-surface); border-radius:28px; padding:22px; display:flex; flex-direction:column; gap:12px\">\n                <div style=\"display:flex; align-items:center; gap:12px\">\n                  <span style=\"width:42px; height:42px; flex:none; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; background:{{ p.dotBg }}; color:{{ p.dotFg }}\">{{ p.initial }}<\u002Fspan>\n                  <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:2px\">\n                    <span style=\"font-size:15.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ p.name }}<\u002Fspan>\n                    <span style=\"font-size:12px; color:var(--color-neutral-700)\">{{ p.kind }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font-size:13px; line-height:1.5; color:var(--color-neutral-700); flex:1\">{{ p.blurb }}<\u002Fspan>\n                <div style=\"display:flex; flex-wrap:wrap; gap:6px\">\n                  <sc-for list=\"{{ p.caps }}\" as=\"c\" hint-placeholder-count=\"2\">\n                    <span class=\"tag tag-neutral\">{{ c.label }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <button class=\"btn {{ p.btnClass }}\" style=\"padding:10px 18px\" disabled=\"{{ p.done }}\" sc-camel-on-click=\"{{ p.connect }}\">{{ p.action }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px; max-width:720px; display:flex; flex-direction:column; gap:13.2px\">\n            <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0; font-size:24px\">Something else<\u002Fh2>\n            <p style=\"margin:0; font-size:13.5px; line-height:1.5; color:var(--color-neutral-700)\">Anything with an API or a CSV export can be wired in by hand. Tell Sauce what it is and it'll walk the setup.<\u002Fp>\n            <div class=\"field\">\n              <label>Platform name<\u002Flabel>\n              <input class=\"input\" value=\"{{ customName }}\" placeholder=\"e.g. Depop, Faire, my Shopify wholesale\" sc-camel-on-input=\"{{ setCustomName }}\">\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:8.8px; flex-wrap:wrap; align-items:center\">\n              <button class=\"btn btn-primary\" style=\"padding:10px 20px\" disabled=\"{{ customDisabled }}\" sc-camel-on-click=\"{{ addCustom }}\">Request connection<\u002Fbutton>\n              <span style=\"font-size:13px; color:var(--color-neutral-700)\">{{ customNote }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ hasPending }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px; max-width:720px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">Just connected<\u002Fh2>\n              <p style=\"margin:0 0 8.8px; font-size:13.5px; color:var(--color-neutral-700)\">Each one needs its catalog mapped before it sells anything.<\u002Fp>\n              <sc-for list=\"{{ pendingPlatforms }}\" as=\"p\" hint-placeholder-count=\"1\">\n                <div style=\"display:flex; align-items:center; gap:13.2px; padding:12px 0; border-top:1px solid var(--color-neutral-300); flex-wrap:wrap\">\n                  <div style=\"flex:1; min-width:160px; display:flex; flex-direction:column; gap:2px\">\n                    <span style=\"font-size:14.5px; font-weight:600\">{{ p.name }}<\u002Fspan>\n                    <span style=\"font-size:12.5px; color:var(--color-neutral-700)\">{{ p.state }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <button class=\"btn btn-secondary\" style=\"flex:none; padding:8px 16px; font-size:13px\" sc-camel-on-click=\"{{ goProducts }}\">Map catalog<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isBreak }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"Break room\" style=\"display:flex; flex-direction:column; gap:17.6px\">\n          <div style=\"display:flex; align-items:flex-end; gap:26.4px; flex-wrap:wrap\">\n            <div style=\"flex:1; min-width:0\">\n              <h1 style=\"font-family:var(--font-heading); font-weight:400; font-size:36px; line-height:1.15; margin:0\">Break room<\u002Fh1>\n              <p style=\"margin:8px 0 0; font-size:15px; line-height:1.55; color:var(--color-neutral-700); max-width:64ch\">Two ways to spend a break: clear the queue one card at a time, or roll a drop idea until something sticks. Progress saves, the timer nags.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px; display:flex; align-items:center; gap:26.4px; flex-wrap:wrap\">\n            <div style=\"display:flex; flex-direction:column; gap:2px; flex:none\">\n              <span style=\"font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700)\">Break timer<\u002Fspan>\n              <span style=\"font-family:var(--font-heading); font-weight:400; font-size:52px; line-height:1.1; color:{{ breakColor }}\">{{ breakClock }}<\u002Fspan>\n              <span style=\"font-size:12.5px; color:var(--color-neutral-700)\">{{ breakNote }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"flex:1; min-width:180px; display:flex; flex-direction:column; gap:10px\">\n              <span style=\"height:10px; border-radius:999px; background:var(--color-neutral-300); display:block; overflow:hidden\">\n                <span style=\"display:block; height:10px; border-radius:999px; background:{{ breakColor }}; width:{{ breakBar }}\"><\u002Fspan>\n              <\u002Fspan>\n              <div style=\"display:flex; gap:8px; flex-wrap:wrap\">\n                <sc-for list=\"{{ breakLengths }}\" as=\"b\" hint-placeholder-count=\"3\">\n                  <button sc-camel-on-click=\"{{ b.start }}\" style=\"font:inherit; font-size:13px; font-weight:600; cursor:pointer; padding:9px 16px; border-radius:999px; border:1px solid {{ b.bc }}; background:{{ b.bg }}; color:{{ b.fg }}\">{{ b.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n                <button class=\"btn btn-secondary\" style=\"padding:9px 16px; font-size:13px\" sc-camel-on-click=\"{{ endBreak }}\">Back to work<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:{{ showTriage }}; flex-direction:column; background:var(--color-surface); border-radius:28px; padding:26.4px; gap:13.2px\">\n            <div style=\"display:flex; align-items:baseline; gap:10px; flex-wrap:wrap\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0; font-size:24px\">Clear the deck<\u002Fh2>\n              <span class=\"tag tag-accent-2\">Real queue<\u002Fspan>\n              <span style=\"flex:1\"><\u002Fspan>\n              <span style=\"font-size:12.5px; color:var(--color-neutral-700)\">Best streak {{ triageBest }}<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:0; font-size:13.5px; line-height:1.5; color:var(--color-neutral-700)\">One card at a time, one decision each. These are your actual held changes — playing this empties the queue for real.<\u002Fp>\n\n            <sc-if value=\"{{ triageHasCard }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"background:var(--color-bg); border-radius:16px; padding:26.4px; display:flex; flex-direction:column; gap:17.6px\">\n                <div style=\"display:flex; align-items:center; gap:10px; flex-wrap:wrap\">\n                  <span class=\"tag tag-accent\">{{ triageKind }}<\u002Fspan>\n                  <span style=\"font-family:ui-monospace, monospace; font-size:11.5px; color:var(--color-neutral-600)\">{{ triageCount }}<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-family:var(--font-heading); font-weight:400; font-size:26px; line-height:1.25\">{{ triageTitle }}<\u002Fspan>\n                <span style=\"font-size:14px; line-height:1.55; color:var(--color-neutral-700)\">{{ triageDetail }}<\u002Fspan>\n                <div style=\"display:flex; gap:8.8px; flex-wrap:wrap\">\n                  <button class=\"btn btn-primary\" style=\"padding:11px 22px\" sc-camel-on-click=\"{{ triageAccept }}\">{{ triageAcceptLabel }}<\u002Fbutton>\n                  <button class=\"btn btn-secondary\" style=\"padding:11px 22px\" sc-camel-on-click=\"{{ triageReject }}\">{{ triageRejectLabel }}<\u002Fbutton>\n                  <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ triageSkip }}\">Not now<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"display:flex; align-items:baseline; gap:14px; border-top:1px solid var(--color-neutral-300); padding-top:13.2px\">\n                  <span style=\"font-family:var(--font-heading); font-size:28px; line-height:1\">{{ triageStreak }}<\u002Fspan>\n                  <span style=\"font-size:13px; color:var(--color-neutral-700)\">{{ triageMsg }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ triageEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:var(--color-bg); border-radius:16px; padding:44px 22px; text-align:center; display:flex; flex-direction:column; gap:8px\">\n                <span style=\"font-family:var(--font-heading); font-weight:400; font-size:26px\">Deck's clear<\u002Fspan>\n                <span style=\"font-size:13.5px; color:var(--color-neutral-700)\">{{ triageClearedNote }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px; display:flex; flex-direction:column; gap:13.2px\">\n            <div style=\"display:flex; align-items:baseline; gap:10px; flex-wrap:wrap\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0; font-size:24px\">Drop roulette<\u002Fh2>\n              <span class=\"tag tag-neutral\">Block breaker<\u002Fspan>\n              <span style=\"flex:1\"><\u002Fspan>\n              <span style=\"font-size:12.5px; color:var(--color-neutral-700)\">{{ savedCount }} kept<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:0; font-size:13.5px; line-height:1.5; color:var(--color-neutral-700)\">Lock what you like, reroll the rest. Nothing here is a commitment — it's for when the page is blank and you need somewhere to start.<\u002Fp>\n\n            <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:13.2px\">\n              <sc-for list=\"{{ slots }}\" as=\"s\" hint-placeholder-count=\"4\">\n                <button sc-camel-on-click=\"{{ s.toggle }}\" style=\"text-align:left; font:inherit; cursor:pointer; background:{{ s.bg }}; border:1px solid {{ s.bc }}; border-radius:16px; padding:17.6px; display:flex; flex-direction:column; gap:6px; min-height:120px\">\n                  <span style=\"display:flex; align-items:center; gap:6px; width:100%\">\n                    <span style=\"font-size:10.5px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700); flex:1\">{{ s.label }}<\u002Fspan>\n                    <span style=\"font-size:11px; font-weight:600; color:{{ s.lockColor }}\">{{ s.lockMark }}<\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"font-size:17px; font-weight:600; line-height:1.3\">{{ s.value }}<\u002Fspan>\n                  <span style=\"font-size:12px; line-height:1.4; color:var(--color-neutral-700)\">{{ s.hint }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"background:var(--color-bg); border-radius:16px; padding:17.6px; display:flex; align-items:center; gap:17.6px; flex-wrap:wrap\">\n              <div style=\"flex:1; min-width:200px; display:flex; flex-direction:column; gap:4px\">\n                <span style=\"font-size:10.5px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700)\">The pitch<\u002Fspan>\n                <span style=\"font-family:var(--font-heading); font-weight:400; font-size:22px; line-height:1.3\">{{ pitch }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex; gap:8px; flex-wrap:wrap; flex:none\">\n                <button class=\"btn btn-primary\" style=\"padding:11px 22px\" sc-camel-on-click=\"{{ reroll }}\">Reroll<\u002Fbutton>\n                <button class=\"btn btn-secondary\" style=\"padding:11px 20px\" sc-camel-on-click=\"{{ keepIdea }}\">Keep it<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ hasSaved }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex; flex-direction:column; gap:0\">\n                <span style=\"font-size:10.5px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-neutral-600); padding-bottom:8px\">Kept ideas<\u002Fspan>\n                <sc-for list=\"{{ savedIdeas }}\" as=\"i\" hint-placeholder-count=\"2\">\n                  <div style=\"display:flex; align-items:center; gap:13.2px; padding:11px 0; border-top:1px solid var(--color-neutral-300); flex-wrap:wrap\">\n                    <span style=\"flex:1; min-width:180px; font-size:14px; font-weight:600\">{{ i.text }}<\u002Fspan>\n                    <span style=\"font-size:12px; color:var(--color-neutral-600); flex:none\">{{ i.by }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px; max-width:680px\">\n            <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">Saved progress<\u002Fh2>\n            <p style=\"margin:0 0 8.8px; font-size:13.5px; color:var(--color-neutral-700)\">Per account, kept between sessions.<\u002Fp>\n            <sc-for list=\"{{ scoreboard }}\" as=\"s\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex; align-items:center; gap:13.2px; padding:11px 0; border-top:1px solid var(--color-neutral-300); flex-wrap:wrap\">\n                <span style=\"width:32px; height:32px; flex:none; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; background:{{ s.dotBg }}; color:{{ s.dotFg }}\">{{ s.initial }}<\u002Fspan>\n                <span style=\"flex:1; min-width:80px; font-size:14px; font-weight:600\">{{ s.name }}<\u002Fspan>\n                <span style=\"font-size:12.5px; color:var(--color-neutral-700); flex:none\">{{ s.cleared }}<\u002Fspan>\n                <span style=\"font-size:12.5px; color:var(--color-neutral-700); flex:none\">{{ s.ideas }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isStub }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <h1 style=\"font-family:var(--font-heading); font-weight:400; font-size:36px; line-height:1.15; margin:0\">{{ stubTitle }}<\u002Fh1>\n          <p style=\"margin:8px 0 17.6px; font-size:15px; line-height:1.55; color:var(--color-neutral-700); max-width:60ch\">{{ stubBlurb }}<\u002Fp>\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px; max-width:620px; display:flex; flex-direction:column; gap:13.2px\">\n            <span style=\"font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700)\">Planned for this screen<\u002Fspan>\n            <sc-for list=\"{{ stubPoints }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex; gap:12px; align-items:flex-start; border-top:1px solid var(--color-neutral-300); padding-top:13.2px\">\n                <span style=\"width:8px; height:8px; border-radius:999px; background:var(--color-accent); flex:none; margin-top:7px\"><\u002Fspan>\n                <span style=\"font-size:14px; line-height:1.5\">{{ p.text }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <span style=\"font-size:13px; line-height:1.5; color:var(--color-neutral-700); border-top:1px solid var(--color-neutral-300); padding-top:13.2px\">This round covered the command center. Say the word and I'll build this one out next.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isProducts }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"display:flex; align-items:flex-end; gap:26.4px; margin-bottom:17.6px\">\n            <div style=\"flex:1; min-width:0\">\n              <h1 style=\"font-family:var(--font-heading); font-weight:400; font-size:36px; line-height:1.15; margin:0\">Product mapping<\u002Fh1>\n              <p style=\"margin:8px 0 0; font-size:15px; line-height:1.55; color:var(--color-neutral-700); max-width:64ch\">Printify blank on the left, the listing it becomes on the right. Unmapped means it isn't earning yet.<\u002Fp>\n            <\u002Fdiv>\n            <button class=\"btn btn-secondary\" style=\"flex:none; padding:11px 20px\">Push unmapped<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:8.8px 0; overflow-x:auto\">\n            <div style=\"display:grid; grid-template-columns:minmax(190px,2.2fr) minmax(190px,2.2fr) 76px 88px 72px 118px; gap:13.2px; padding:8px 26.4px 10px; min-width:880px; font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700); white-space:nowrap\">\n              <span>Printify product<\u002Fspan><span>GoDaddy listing<\u002Fspan><span>Variants<\u002Fspan><span>Price<\u002Fspan><span>Stock<\u002Fspan><span>State<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ products }}\" as=\"row\" hint-placeholder-count=\"7\">\n              <div style=\"display:grid; grid-template-columns:minmax(190px,2.2fr) minmax(190px,2.2fr) 76px 88px 72px 118px; gap:13.2px; align-items:center; padding:9px 26.4px; min-width:880px; border-top:1px solid var(--color-neutral-300); font-size:14px\" style-hover=\"background:color-mix(in srgb, var(--color-accent) 8%, transparent)\">\n                <div style=\"display:flex; flex-direction:column; min-width:0\">\n                  <span style=\"font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis\">{{ row.printify }}<\u002Fspan>\n                  <span style=\"font-family:ui-monospace, monospace; font-size:11.5px; color:var(--color-neutral-600)\">{{ row.blank }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex; flex-direction:column; min-width:0\">\n                  <span style=\"white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:{{ row.listingColor }}\">{{ row.listing }}<\u002Fspan>\n                  <span style=\"font-family:ui-monospace, monospace; font-size:11.5px; color:var(--color-neutral-600)\">{{ row.sku }}<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-family:ui-monospace, monospace; font-size:12.5px\">{{ row.variants }}<\u002Fspan>\n                <span style=\"font-family:ui-monospace, monospace; font-size:12.5px\">{{ row.price }}<\u002Fspan>\n                <span style=\"font-family:ui-monospace, monospace; font-size:12.5px\">{{ row.stock }}<\u002Fspan>\n                <span class=\"tag {{ row.tag }}\" style=\"justify-self:start\">{{ row.state }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isOrders }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <h1 style=\"font-family:var(--font-heading); font-weight:400; font-size:36px; line-height:1.15; margin:0\">Orders queue<\u002Fh1>\n          <p style=\"margin:8px 0 17.6px; font-size:15px; line-height:1.55; color:var(--color-neutral-700); max-width:70ch\">GoDaddy takes the money, Printify makes the thing, tracking walks back. Nothing here needs you unless it's flagged.<\u002Fp>\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:8.8px 0; overflow-x:auto\">\n            <div style=\"display:grid; grid-template-columns:96px minmax(130px,1.4fr) minmax(190px,1.8fr) 92px 132px 112px; gap:13.2px; padding:8px 26.4px 10px; min-width:900px; font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700); white-space:nowrap\">\n              <span>Order<\u002Fspan><span>Customer<\u002Fspan><span>Items<\u002Fspan><span>Total<\u002Fspan><span>Tracking<\u002Fspan><span>Stage<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ orders }}\" as=\"o\" hint-placeholder-count=\"6\">\n              <div style=\"display:grid; grid-template-columns:96px minmax(130px,1.4fr) minmax(190px,1.8fr) 92px 132px 112px; gap:13.2px; align-items:center; padding:9px 26.4px; min-width:900px; border-top:1px solid var(--color-neutral-300); font-size:14px\" style-hover=\"background:color-mix(in srgb, var(--color-accent) 8%, transparent)\">\n                <span style=\"font-family:ui-monospace, monospace; font-size:12.5px; font-weight:600\">{{ o.id }}<\u002Fspan>\n                <div style=\"display:flex; flex-direction:column; min-width:0\">\n                  <span>{{ o.customer }}<\u002Fspan>\n                  <span style=\"font-size:12px; color:var(--color-neutral-600)\">{{ o.place }}<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis\">{{ o.items }}<\u002Fspan>\n                <span style=\"font-family:ui-monospace, monospace; font-size:12.5px\">{{ o.total }}<\u002Fspan>\n                <span style=\"font-family:ui-monospace, monospace; font-size:12px; color:{{ o.trackColor }}\">{{ o.tracking }}<\u002Fspan>\n                <span class=\"tag {{ o.tag }}\" style=\"justify-self:start\">{{ o.stage }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isRewards }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"display:flex; align-items:flex-end; gap:26.4px; margin-bottom:17.6px\">\n            <div style=\"flex:1; min-width:0\">\n              <h1 style=\"font-family:var(--font-heading); font-weight:400; font-size:36px; line-height:1.15; margin:0\">Rewards &amp; loyalty<\u002Fh1>\n              <p style=\"margin:8px 0 0; font-size:15px; line-height:1.55; color:var(--color-neutral-700); max-width:64ch\">Points are earned on GoDaddy checkout and spent as codes the bridge pushes back. Certificates work the same way — issue here, redeem on the store.<\u002Fp>\n            <\u002Fdiv>\n            <button class=\"btn btn-primary\" style=\"flex:none; padding:11px 20px\" sc-camel-on-click=\"{{ issueCert }}\">Issue certificate<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:17.6px; margin-bottom:17.6px\">\n            <sc-for list=\"{{ loyaltyStats }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"background:var(--color-surface); border-radius:28px; padding:22px; display:flex; flex-direction:column; gap:6px\">\n                <span style=\"font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700)\">{{ s.label }}<\u002Fspan>\n                <span style=\"font-family:var(--font-heading); font-weight:400; font-size:40px; line-height:1.25\">{{ s.value }}<\u002Fspan>\n                <span style=\"font-size:12.5px; color:var(--color-neutral-700)\">{{ s.note }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px; margin-bottom:17.6px\">\n            <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">Tiers<\u002Fh2>\n            <p style=\"margin:0 0 17.6px; font-size:13.5px; color:var(--color-neutral-700)\">Lifetime spend moves a member up. Perks apply at checkout automatically.<\u002Fp>\n            <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(250px,1fr)); gap:17.6px\">\n              <sc-for list=\"{{ tiers }}\" as=\"t\" hint-placeholder-count=\"3\">\n                <div style=\"background:var(--color-bg); border-radius:16px; padding:17.6px; display:flex; gap:14px; align-items:flex-start\">\n                  <span style=\"width:52px; height:52px; flex:none; border-radius:999px; display:flex; align-items:center; justify-content:center; font-family:var(--font-heading); font-size:19px; background:{{ t.dotBg }}; color:{{ t.dotFg }}\">{{ t.initial }}<\u002Fspan>\n                  <div style=\"display:flex; flex-direction:column; gap:4px; min-width:0\">\n                    <span style=\"font-family:var(--font-heading); font-weight:400; font-size:20px\">{{ t.name }}<\u002Fspan>\n                    <span style=\"font-size:12.5px; color:var(--color-neutral-700)\">{{ t.threshold }}<\u002Fspan>\n                    <span style=\"font-size:13px; line-height:1.45\">{{ t.perk }}<\u002Fspan>\n                    <span style=\"font-size:12.5px; font-weight:600; color:var(--color-accent-700)\">{{ t.members }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(620px,1fr)); gap:17.6px; align-items:start\">\n            <div style=\"background:var(--color-surface); border-radius:28px; padding:8.8px 0; overflow-x:auto\">\n              <div style=\"padding:13.2px 26.4px 4px\">\n                <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0; font-size:24px\">Members<\u002Fh2>\n              <\u002Fdiv>\n              <div style=\"display:grid; grid-template-columns:minmax(150px,1.6fr) 92px 76px 92px 96px; gap:13.2px; padding:8px 26.4px 10px; min-width:600px; font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700); white-space:nowrap\">\n                <span>Member<\u002Fspan><span>Tier<\u002Fspan><span>Points<\u002Fspan><span>Lifetime<\u002Fspan><span>Last order<\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ members }}\" as=\"m\" hint-placeholder-count=\"7\">\n                <div style=\"display:grid; grid-template-columns:minmax(150px,1.6fr) 92px 76px 92px 96px; gap:13.2px; align-items:center; padding:9px 26.4px; min-width:600px; border-top:1px solid var(--color-neutral-300); font-size:14px\" style-hover=\"background:color-mix(in srgb, var(--color-accent) 8%, transparent)\">\n                  <div style=\"display:flex; flex-direction:column; min-width:0\">\n                    <span style=\"font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis\">{{ m.name }}<\u002Fspan>\n                    <span style=\"font-size:11.5px; color:var(--color-neutral-600); white-space:nowrap; overflow:hidden; text-overflow:ellipsis\">{{ m.email }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <span class=\"tag {{ m.tag }}\" style=\"justify-self:start\">{{ m.tier }}<\u002Fspan>\n                  <span style=\"font-family:ui-monospace, monospace; font-size:12.5px\">{{ m.points }}<\u002Fspan>\n                  <span style=\"font-family:ui-monospace, monospace; font-size:12.5px\">{{ m.lifetime }}<\u002Fspan>\n                  <span style=\"font-size:12.5px; color:var(--color-neutral-700)\">{{ m.last }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px; display:flex; flex-direction:column; gap:8.8px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0; font-size:24px\">Gift certificates<\u002Fh2>\n              <p style=\"margin:0 0 4px; font-size:13.5px; color:var(--color-neutral-700)\">Balance follows the code across orders.<\u002Fp>\n              <sc-for list=\"{{ certs }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <div style=\"border-top:1px solid var(--color-neutral-300); padding:13.2px 0; display:flex; align-items:center; gap:13.2px\">\n                  <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:3px\">\n                    <span style=\"font-family:ui-monospace, monospace; font-size:13.5px; font-weight:600\">{{ c.code }}<\u002Fspan>\n                    <span style=\"font-size:12px; color:var(--color-neutral-700)\">{{ c.note }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex; flex-direction:column; align-items:flex-end; gap:3px; flex:none\">\n                    <span style=\"font-family:ui-monospace, monospace; font-size:14px; font-weight:600\">{{ c.balance }}<\u002Fspan>\n                    <span class=\"tag {{ c.tag }}\">{{ c.state }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isRules }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <h1 style=\"font-family:var(--font-heading); font-weight:400; font-size:36px; line-height:1.15; margin:0\">Inventory &amp; pricing rules<\u002Fh1>\n          <p style=\"margin:8px 0 17.6px; font-size:15px; line-height:1.55; color:var(--color-neutral-700); max-width:64ch\">Set it once. The bridge does the arithmetic every time a blank moves.<\u002Fp>\n\n          <div style=\"display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:17.6px; align-items:start\">\n            <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px; display:flex; flex-direction:column; gap:17.6px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0; font-size:24px\">Pricing<\u002Fh2>\n              <div class=\"field\">\n                <label>Markup over Printify cost<\u002Flabel>\n                <div style=\"display:flex; align-items:center; gap:17.6px\">\n                  <input class=\"input\" type=\"range\" min=\"40\" max=\"320\" step=\"5\" value=\"{{ markup }}\" sc-camel-on-input=\"{{ setMarkup }}\" style=\"flex:1; padding:0; border:0; background:transparent; accent-color:var(--color-accent)\">\n                  <span style=\"font-family:ui-monospace, monospace; font-size:15px; font-weight:600; width:58px; text-align:right\">{{ markupLabel }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"field\">\n                <label>Round retail to<\u002Flabel>\n                <div class=\"seg\">\n                  <label class=\"seg-opt\"><input type=\"radio\" name=\"round\" sc-camel-default-checked=\"{{ true }}\"><span>.99<\u002Fspan><\u002Flabel>\n                  <label class=\"seg-opt\"><input type=\"radio\" name=\"round\"><span>.00<\u002Fspan><\u002Flabel>\n                  <label class=\"seg-opt\"><input type=\"radio\" name=\"round\"><span>.95<\u002Fspan><\u002Flabel>\n                  <label class=\"seg-opt\"><input type=\"radio\" name=\"round\"><span>Off<\u002Fspan><\u002Flabel>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:var(--color-bg); border-radius:16px; padding:17.6px; display:flex; flex-direction:column; gap:8px\">\n                <span style=\"font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700)\">Worked example<\u002Fspan>\n                <div style=\"display:flex; justify-content:space-between; gap:13.2px; font-size:14px\"><span>Heavyweight hoodie — cost<\u002Fspan><span style=\"font-family:ui-monospace, monospace\">$26.14<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex; justify-content:space-between; gap:13.2px; font-size:14px\"><span>Retail after rule<\u002Fspan><span style=\"font-family:ui-monospace, monospace; font-weight:600; color:var(--color-accent-700)\">{{ examplePrice }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex; justify-content:space-between; gap:13.2px; font-size:14px\"><span>Margin<\u002Fspan><span style=\"font-family:ui-monospace, monospace\">{{ exampleMargin }}<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px; display:flex; flex-direction:column; gap:8.8px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">Inventory behaviour<\u002Fh2>\n              <sc-for list=\"{{ toggles }}\" as=\"t\" hint-placeholder-count=\"5\">\n                <button sc-camel-on-click=\"{{ t.toggle }}\" style=\"display:flex; align-items:flex-start; gap:14px; width:100%; text-align:left; font:inherit; cursor:pointer; background:transparent; border:0; border-top:1px solid var(--color-neutral-300); padding:13.2px 0\">\n                  <span style=\"width:40px; height:22px; flex:none; margin-top:1px; border-radius:999px; position:relative; transition:background 160ms; background:{{ t.trackBg }}\">\n                    <span style=\"position:absolute; top:3px; width:16px; height:16px; border-radius:999px; transition:left 160ms; background:{{ t.knobBg }}; left:{{ t.knobLeft }}\"><\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"flex:1; display:flex; flex-direction:column; gap:3px\">\n                    <span style=\"font-size:14.5px; font-weight:600\">{{ t.label }}<\u002Fspan>\n                    <span style=\"font-size:12.5px; line-height:1.45; color:var(--color-neutral-700)\">{{ t.note }}<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isConflicts }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <h1 style=\"font-family:var(--font-heading); font-weight:400; font-size:36px; line-height:1.15; margin:0\">Conflicts<\u002Fh1>\n          <p style=\"margin:8px 0 17.6px; font-size:15px; line-height:1.55; color:var(--color-neutral-700); max-width:64ch\">Two sources disagreed. Pick a winner and the bridge stops asking.<\u002Fp>\n          <div style=\"display:flex; flex-direction:column; gap:17.6px; max-width:920px\">\n            <sc-for list=\"{{ conflicts }}\" as=\"c\" hint-placeholder-count=\"3\">\n              <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px\">\n                <div style=\"display:flex; align-items:center; gap:13.2px; margin-bottom:17.6px; flex-wrap:wrap\">\n                  <span class=\"tag {{ c.tag }}\">{{ c.kind }}<\u002Fspan>\n                  <span style=\"font-family:var(--font-heading); font-weight:400; font-size:22px\">{{ c.title }}<\u002Fspan>\n                  <span style=\"flex:1\"><\u002Fspan>\n                  <span style=\"font-family:ui-monospace, monospace; font-size:12px; color:var(--color-neutral-600)\">{{ c.time }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:17.6px\">\n                  <div style=\"background:var(--color-bg); border-radius:16px; padding:17.6px; display:flex; flex-direction:column; gap:8px\">\n                    <span style=\"font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700)\">GoDaddy says<\u002Fspan>\n                    <span style=\"font-family:ui-monospace, monospace; font-size:17px; font-weight:600\">{{ c.gd }}<\u002Fspan>\n                    <span style=\"font-size:12.5px; line-height:1.45; color:var(--color-neutral-700); flex:1\">{{ c.gdNote }}<\u002Fspan>\n                    <button class=\"btn btn-secondary\" style=\"padding:9px 18px\" sc-camel-on-click=\"{{ c.keepGd }}\">Keep this<\u002Fbutton>\n                  <\u002Fdiv>\n                  <div style=\"background:var(--color-bg); border-radius:16px; padding:17.6px; display:flex; flex-direction:column; gap:8px\">\n                    <span style=\"font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700)\">Printify says<\u002Fspan>\n                    <span style=\"font-family:ui-monospace, monospace; font-size:17px; font-weight:600\">{{ c.pf }}<\u002Fspan>\n                    <span style=\"font-size:12.5px; line-height:1.45; color:var(--color-neutral-700); flex:1\">{{ c.pfNote }}<\u002Fspan>\n                    <button class=\"btn btn-primary\" style=\"padding:9px 18px\" sc-camel-on-click=\"{{ c.keepPf }}\">Keep this<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ conflictsClear }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:var(--color-surface); border-radius:28px; padding:44px; text-align:center; max-width:920px\">\n              <span style=\"font-family:var(--font-heading); font-weight:400; font-size:26px\">Queue's clean. Go make something.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isLog }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <h1 style=\"font-family:var(--font-heading); font-weight:400; font-size:36px; line-height:1.15; margin:0\">Sync activity<\u002Fh1>\n          <p style=\"margin:8px 0 17.6px; font-size:15px; line-height:1.55; color:var(--color-neutral-700)\">Every call the bridge made, newest first.<\u002Fp>\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:8.8px 0; max-width:1000px; overflow-x:auto\">\n            <sc-for list=\"{{ log }}\" as=\"l\" hint-placeholder-count=\"10\">\n              <div style=\"display:grid; grid-template-columns:84px 92px minmax(260px,1fr) 92px; gap:13.2px; align-items:center; padding:9px 26.4px; min-width:640px; border-bottom:1px solid var(--color-neutral-300); font-size:13.5px\">\n                <span style=\"font-family:ui-monospace, monospace; font-size:12px; color:var(--color-neutral-600)\">{{ l.time }}<\u002Fspan>\n                <span style=\"font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--color-accent-700)\">{{ l.source }}<\u002Fspan>\n                <span>{{ l.text }}<\u002Fspan>\n                <span class=\"tag {{ l.tag }}\" style=\"justify-self:start\">{{ l.state }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSettings }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <h1 style=\"font-family:var(--font-heading); font-weight:400; font-size:36px; line-height:1.15; margin:0\">Settings &amp; schedule<\u002Fh1>\n          <p style=\"margin:8px 0 17.6px; font-size:15px; line-height:1.55; color:var(--color-neutral-700); max-width:64ch\">How often the bridge wakes up, and who it tells when something's off.<\u002Fp>\n          <div style=\"display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:17.6px; align-items:start; max-width:1000px\">\n            <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px; display:flex; flex-direction:column; gap:17.6px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0; font-size:24px\">Schedule<\u002Fh2>\n              <div class=\"field\">\n                <label>Run the bridge<\u002Flabel>\n                <div class=\"seg\">\n                  <sc-for list=\"{{ cadences }}\" as=\"c\" hint-placeholder-count=\"4\">\n                    <label class=\"seg-opt\" style=\"background:{{ c.bg }}; color:{{ c.fg }}\">\n                      <input type=\"radio\" name=\"cadence\" sc-camel-on-change=\"{{ c.pick }}\">\n                      <span>{{ c.label }}<\u002Fspan>\n                    <\u002Flabel>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"field\">\n                <label>Quiet hours (no pushes)<\u002Flabel>\n                <input class=\"input\" value=\"23:00 – 07:00 PT\" sc-camel-read-only=\"{{ true }}\">\n              <\u002Fdiv>\n              <div class=\"field\">\n                <label>Store<\u002Flabel>\n                <input class=\"input\" value=\"{{ storeName }}\" sc-camel-read-only=\"{{ true }}\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px; display:flex; flex-direction:column; gap:8.8px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">Connections<\u002Fh2>\n              <sc-for list=\"{{ connections }}\" as=\"k\" hint-placeholder-count=\"2\">\n                <div style=\"border-top:1px solid var(--color-neutral-300); padding:13.2px 0; display:flex; align-items:center; gap:13.2px; flex-wrap:wrap\">\n                  <div style=\"flex:1; min-width:160px; display:flex; flex-direction:column; gap:2px\">\n                    <span style=\"font-size:14.5px; font-weight:600\">{{ k.name }}<\u002Fspan>\n                    <span style=\"font-family:ui-monospace, monospace; font-size:12px; color:var(--color-neutral-600)\">{{ k.scope }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <span class=\"tag tag-accent\">{{ k.state }}<\u002Fspan>\n                  <button class=\"btn btn-ghost\">Re-auth<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"border-top:1px solid var(--color-neutral-300); padding-top:13.2px; font-size:13px; color:var(--color-neutral-700); line-height:1.55\">\n                Tokens are scoped to products, inventory and orders only. Nothing touches DNS or billing.\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fmain>\n  <\u002Fdiv>\n\n  <button sc-camel-on-click=\"{{ toggleAssistant }}\" style=\"position:absolute; right:26.4px; bottom:26.4px; z-index:45; display:flex; align-items:center; gap:10px; font:inherit; font-weight:600; font-size:14px; cursor:pointer; padding:13px 22px; border:0; border-radius:999px; background:var(--color-accent); color:var(--color-bg); box-shadow:var(--shadow-lg)\">\n    <span style=\"width:10px; height:10px; border-radius:999px; background:#aebf92; display:block\"><\u002Fspan>\n    {{ assistantButtonLabel }}\n  <\u002Fbutton>\n\n  <sc-if value=\"{{ assistantOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute; right:26.4px; bottom:92px; z-index:46; width:400px; max-width:calc(100% - 52.8px); max-height:calc(100% - 140px); background:var(--color-surface); border-radius:28px; box-shadow:var(--shadow-lg); display:flex; flex-direction:column; overflow:hidden\">\n      <div style=\"padding:22px 22px 13.2px; display:flex; align-items:flex-start; gap:12px\">\n        <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:3px\">\n          <span style=\"font-family:var(--font-heading); font-weight:400; font-size:22px\">Sauce, your guide<\u002Fspan>\n          <span style=\"font-size:12.5px; line-height:1.45; color:var(--color-neutral-700)\">{{ assistantSub }}<\u002Fspan>\n        <\u002Fdiv>\n        <button class=\"btn btn-ghost\" style=\"flex:none\" sc-camel-on-click=\"{{ toggleAssistant }}\">Close<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"flex:1; overflow-y:auto; padding:0 22px; display:flex; flex-direction:column; gap:10px\">\n        <sc-for list=\"{{ chat }}\" as=\"m\" hint-placeholder-count=\"2\">\n          <div style=\"align-self:{{ m.align }}; max-width:88%; background:{{ m.bg }}; color:{{ m.fg }}; border-radius:{{ m.radius }}; padding:12px 15px; display:flex; flex-direction:column; gap:9px\">\n            <span style=\"font-size:13.5px; line-height:1.5\">{{ m.text }}<\u002Fspan>\n            <sc-if value=\"{{ m.hasAction }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ m.act }}\" style=\"align-self:flex-start; font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; padding:7px 14px; border-radius:999px; border:1px solid var(--color-accent); background:transparent; color:var(--color-accent-800)\">{{ m.actionLabel }}<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"padding:13.2px 22px 22px; display:flex; flex-direction:column; gap:8px\">\n        <span style=\"font-size:10.5px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-neutral-600)\">Try asking<\u002Fspan>\n        <div style=\"display:flex; flex-wrap:wrap; gap:7px\">\n          <sc-for list=\"{{ prompts }}\" as=\"p\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ p.ask }}\" style=\"font:inherit; font-size:12.5px; cursor:pointer; padding:8px 14px; border-radius:999px; border:1px solid var(--color-neutral-300); background:var(--color-bg); color:inherit\" style-hover=\"border-color:var(--color-accent)\">{{ p.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ signedOut }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute; inset:0; z-index:60; background:var(--color-bg); display:flex; align-items:center; justify-content:center; padding:26.4px\">\n      <div style=\"width:100%; max-width:460px; display:flex; flex-direction:column; gap:26.4px\">\n        <div style=\"display:flex; flex-direction:column; gap:8px\">\n          <span style=\"font-family:var(--font-heading); font-size:38px; line-height:1.1; color:var(--color-accent-800)\">Saucy Sync<\u002Fspan>\n          <span style=\"font-size:14.5px; line-height:1.55; color:var(--color-neutral-700)\">Sign in. Each account sees only what its role allows — and every change is logged against the name that made it.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px; display:flex; flex-direction:column; gap:13.2px\">\n          <span style=\"font-size:10.5px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-neutral-600)\">Choose an account<\u002Fspan>\n          <sc-for list=\"{{ accounts }}\" as=\"a\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ a.pick }}\" style=\"display:flex; align-items:center; gap:13.2px; width:100%; text-align:left; font:inherit; cursor:pointer; padding:12px 14px; border:1px solid {{ a.bc }}; border-radius:16px; background:{{ a.bg }}\">\n              <span style=\"width:40px; height:40px; flex:none; border-radius:999px; display:flex; align-items:center; justify-content:center; font-family:var(--font-heading); font-size:17px; background:{{ a.dotBg }}; color:{{ a.dotFg }}\">{{ a.initial }}<\u002Fspan>\n              <span style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:2px\">\n                <span style=\"font-size:15px; font-weight:600\">{{ a.name }}<\u002Fspan>\n                <span style=\"font-family:ui-monospace, monospace; font-size:11.5px; color:var(--color-neutral-700); overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ a.email }}<\u002Fspan>\n              <\u002Fspan>\n              <span class=\"tag {{ a.tag }}\" style=\"flex:none\">{{ a.role }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n          <div class=\"field\" style=\"margin-top:4px\">\n            <label>Password<\u002Flabel>\n            <input class=\"input\" type=\"password\" value=\"••••••••••\" sc-camel-read-only=\"{{ true }}\">\n          <\u002Fdiv>\n          <button class=\"btn btn-primary btn-block\" style=\"padding:12px 22px\" disabled=\"{{ signInDisabled }}\" sc-camel-on-click=\"{{ signIn }}\">{{ signInLabel }}<\u002Fbutton>\n          <span style=\"font-size:12px; line-height:1.5; color:var(--color-neutral-700); text-align:center\">Two-factor is required on the master account.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;storeName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Saucy Streetwear — GoDaddy store&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Store&quot;},&quot;domain&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;saucystreetwear.com&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Store&quot;},&quot;ownerName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Beanz&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Team&quot;},&quot;designerName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Kenzey&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Team&quot;},&quot;partnerName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Cynthia&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Team&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    view: \"dash\",\n    markup: 165,\n    cadence: \"15 min\",\n    syncing: false,\n    syncStep: \"\",\n    resolved: {},\n    extraLog: [],\n    issued: 0,\n    range: \"7 days\",\n    mediaIdx: 0,\n    routes: {},\n    routedCount: 0,\n    doneDecisions: {},\n    autoOn: true,\n    propSpeed: \"Live\",\n    truth: { price: \"Rule\", stock: \"Printify\", images: \"Library\", copy: \"GoDaddy\" },\n    fan: {},\n    pushedHeld: {},\n    approved: {},\n    sqFixed: false,\n    domainDone: {},\n    seat: \"owner\",\n    perms: {},\n    signedOut: false,\n    pendingAccount: \"owner\",\n    accountMenuOpen: false,\n    assistantOpen: false,\n    chatLog: [],\n    diagRunning: false,\n    diagFixed: {},\n    highlight: null,\n    mode: \"Simple\",\n    connected: [],\n    customName: \"\",\n    customAsked: false,\n    dashTab: \"Today\",\n    breakLeft: 0,\n    breakTotal: 300,\n    triageIdx: 0,\n    triageStreak: 0,\n    triageMsg: \"Decide one and the streak starts.\",\n    triageCleared: 0,\n    rollIdx: 0,\n    locks: {},\n    lockedAt: {},\n    savedIdeas: [],\n    bests: {\n      owner: { streak: 0, cleared: 0, ideas: 0 },\n      design: { streak: 6, cleared: 14, ideas: 3 },\n      partner: { streak: 4, cleared: 5, ideas: 9 }\n    },\n    toggles: { oos: true, variants: true, retire: false, images: true, tax: false }\n  };\n\n  componentDidMount() {\n    this._tick = setInterval(() => {\n      if (this.state.breakLeft > 0) this.setState(s => ({ breakLeft: Math.max(0, s.breakLeft - 1) }));\n    }, 1000);\n  }\n\n  componentWillUnmount() { clearTimeout(this._t); clearTimeout(this._d); clearInterval(this._tick); }\n\n  startBreak(mins) {\n    return () => this.setState({ breakLeft: mins * 60, breakTotal: mins * 60 });\n  }\n\n  endBreak = () => this.setState({ breakLeft: 0, view: \"dash\" });\n\n  connectPlatform(id) {\n    return () => this.setState(s => ({ connected: s.connected.concat([id]) }));\n  }\n\n  setCustomName = e => this.setState({ customName: e.target.value });\n\n  addCustom = () => {\n    const name = this.state.customName.trim();\n    if (!name) return;\n    this.setState(s => ({ connected: s.connected.concat([\"custom:\" + name]), customName: \"\", customAsked: true }));\n  };\n\n  saveBest(game, value) {\n    this.setState(s => {\n      const seat = s.seat;\n      const cur = s.bests[seat] || { swatch: 0, whack: 0 };\n      if (value <= cur[game]) return {};\n      const next = Object.assign({}, cur); next[game] = value;\n      return { bests: Object.assign({}, s.bests, { [seat]: next }) };\n    });\n  }\n\n  decideCard(resolve) {\n    return () => {\n      const streak = resolve ? this.state.triageStreak + 1 : 0;\n      if (resolve) {\n        const cleared = this.state.triageCleared + 1;\n        this.saveBest(\"streak\", streak);\n        this.setState({ triageCleared: cleared });\n        this.saveBest(\"cleared\", cleared);\n      }\n      this.setState(s => ({\n        triageIdx: s.triageIdx + 1,\n        triageStreak: streak,\n        triageMsg: resolve\n          ? (streak >= 4 ? \"Four in a row. This is just working, but faster.\" : \"Cleared — that's off the queue for good.\")\n          : \"Skipped. It'll be here tomorrow.\"\n      }));\n    };\n  }\n\n  toggleLock(k) {\n    return () => this.setState(s => ({\n      locks: Object.assign({}, s.locks, { [k]: !s.locks[k] }),\n      lockedAt: Object.assign({}, s.lockedAt, { [k]: s.locks[k] ? undefined : s.rollIdx })\n    }));\n  }\n\n  reroll = () => this.setState(s => ({ rollIdx: s.rollIdx + 1 }));\n\n  keepIdea(text) {\n    return () => {\n      this.saveBest(\"ideas\", this.state.savedIdeas.length + 1);\n      this.setState(s => ({ savedIdeas: [{ text, by: \"just now\" }].concat(s.savedIdeas) }));\n    };\n  }\n\n  seatAllowed = {\n    owner: null,\n    design: [\"dash\", \"today\", \"ch-godaddy\", \"ch-tiktok\", \"ch-meta\", \"ch-square\", \"fl-printify\", \"products\", \"orders\", \"rules\", \"conflicts\", \"md-library\", \"md-social\", \"md-ads\", \"md-brand\", \"st-pages\", \"growth\", \"st-analytics\", \"st-domains\", \"log\", \"add-platform\"],\n    partner: [\"dash\", \"today\", \"md-library\", \"md-social\", \"md-brand\", \"growth\", \"st-analytics\", \"break\"]\n  };\n\n  canSee(id, seat) {\n    const list = this.seatAllowed[seat || this.state.seat];\n    if (!li
