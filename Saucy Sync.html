ding:26.4px\">\n              <div style=\"display:flex; align-items:center; gap:13.2px; margin-bottom:4px\">\n                <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0; font-size:24px\">Site pages<\u002Fh2>\n                <span style=\"flex:1\"><\u002Fspan>\n                <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ goPages }}\">All pages<\u002Fbutton>\n              <\u002Fdiv>\n              <p style=\"margin:0 0 8.8px; font-size:13.5px; color:var(--color-neutral-700)\">The ones that move money.<\u002Fp>\n              <sc-for list=\"{{ gdPages }}\" as=\"p\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex; align-items:center; gap:13.2px; padding:10px 0; border-top:1px solid var(--color-neutral-300)\">\n                  <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:2px\">\n                    <span style=\"font-size:14px; font-weight:600\">{{ p.name }}<\u002Fspan>\n                    <span style=\"font-family:ui-monospace, monospace; font-size:11.5px; color:var(--color-neutral-600)\">{{ p.path }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <span class=\"tag {{ p.tag }}\" style=\"flex:none\">{{ p.state }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isTikTok }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"TikTok Shop\" style=\"display:flex; flex-direction:column; gap:17.6px\">\n          <div>\n            <h1 style=\"font-family:var(--font-heading); font-weight:400; font-size:36px; line-height:1.15; margin:0\">TikTok Shop<\u002Fh1>\n            <p style=\"margin:8px 0 0; font-size:15px; line-height:1.55; color:var(--color-neutral-700); max-width:66ch\">Same catalog, same SKUs, same production queue. Orders here go to Printify like any other channel.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:17.6px\">\n            <sc-for list=\"{{ ttStats }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"background:var(--color-surface); border-radius:28px; padding:22px; display:flex; flex-direction:column; gap:6px\">\n                <span style=\"font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700)\">{{ s.label }}<\u002Fspan>\n                <span style=\"font-family:var(--font-heading); font-weight:400; font-size:38px; line-height:1.25\">{{ s.value }}<\u002Fspan>\n                <span style=\"font-size:12.5px; color:var(--color-neutral-700)\">{{ s.note }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(420px,1fr)); gap:17.6px; align-items:start\">\n            <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">Catalog<\u002Fh2>\n              <p style=\"margin:0 0 8.8px; font-size:13.5px; color:var(--color-neutral-700)\">Thirteen products aren't on TikTok yet.<\u002Fp>\n              <sc-for list=\"{{ ttCatalog }}\" as=\"c\" hint-placeholder-count=\"6\">\n                <div style=\"display:flex; align-items:center; gap:13.2px; padding:10px 0; border-top:1px solid var(--color-neutral-300)\">\n                  <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:2px\">\n                    <span style=\"font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ c.name }}<\u002Fspan>\n                    <span style=\"font-family:ui-monospace, monospace; font-size:11.5px; color:var(--color-neutral-600)\">{{ c.sku }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <span class=\"tag {{ c.tag }}\" style=\"flex:none\">{{ c.state }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">Videos that sold<\u002Fh2>\n              <p style=\"margin:0 0 8.8px; font-size:13.5px; color:var(--color-neutral-700)\">Which post drove which order.<\u002Fp>\n              <sc-for list=\"{{ ttVideos }}\" as=\"v\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex; gap:13.2px; padding:11px 0; border-top:1px solid var(--color-neutral-300); align-items:center\">\n                  <span style=\"width:42px; height:54px; flex:none; border-radius:12px; background:repeating-linear-gradient(135deg, var(--color-neutral-300) 0 6px, var(--color-neutral-200) 6px 12px)\"><\u002Fspan>\n                  <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:2px\">\n                    <span style=\"font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ v.title }}<\u002Fspan>\n                    <span style=\"font-size:12.5px; color:var(--color-neutral-700)\">{{ v.meta }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:2px\">\n                    <span style=\"font-family:ui-monospace, monospace; font-size:14px; font-weight:600\">{{ v.revenue }}<\u002Fspan>\n                    <span style=\"font-size:12px; color:var(--color-neutral-700)\">{{ v.orders }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isMeta }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"IG / FB Shops\" style=\"display:flex; flex-direction:column; gap:17.6px\">\n          <div>\n            <h1 style=\"font-family:var(--font-heading); font-weight:400; font-size:36px; line-height:1.15; margin:0\">Instagram &amp; Facebook Shops<\u002Fh1>\n            <p style=\"margin:8px 0 0; font-size:15px; line-height:1.55; color:var(--color-neutral-700); max-width:66ch\">One Meta catalog feeding both shops, plus every post with a product tagged in it.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:17.6px\">\n            <sc-for list=\"{{ metaStats }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"background:var(--color-surface); border-radius:28px; padding:22px; display:flex; flex-direction:column; gap:6px\">\n                <span style=\"font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700)\">{{ s.label }}<\u002Fspan>\n                <span style=\"font-family:var(--font-heading); font-weight:400; font-size:38px; line-height:1.25\">{{ s.value }}<\u002Fspan>\n                <span style=\"font-size:12.5px; color:var(--color-neutral-700)\">{{ s.note }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(420px,1fr)); gap:17.6px; align-items:start\">\n            <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">Feed health<\u002Fh2>\n              <p style=\"margin:0 0 8.8px; font-size:13.5px; color:var(--color-neutral-700)\">Meta rejects quietly. This is the loud version.<\u002Fp>\n              <sc-for list=\"{{ metaFeed }}\" as=\"f\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex; align-items:center; gap:13.2px; padding:11px 0; border-top:1px solid var(--color-neutral-300)\">\n                  <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:2px\">\n                    <span style=\"font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ f.name }}<\u002Fspan>\n                    <span style=\"font-size:12.5px; line-height:1.4; color:var(--color-neutral-700)\">{{ f.issue }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <span class=\"tag {{ f.tag }}\" style=\"flex:none\">{{ f.state }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">Tagged posts<\u002Fh2>\n              <p style=\"margin:0 0 8.8px; font-size:13.5px; color:var(--color-neutral-700)\">Posts with a shoppable product attached.<\u002Fp>\n              <sc-for list=\"{{ metaPosts }}\" as=\"p\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex; gap:13.2px; padding:11px 0; border-top:1px solid var(--color-neutral-300); align-items:center\">\n                  <span style=\"width:46px; height:46px; flex:none; border-radius:12px; background:repeating-linear-gradient(135deg, var(--color-neutral-300) 0 6px, var(--color-neutral-200) 6px 12px)\"><\u002Fspan>\n                  <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:2px\">\n                    <span style=\"font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ p.title }}<\u002Fspan>\n                    <span style=\"font-size:12.5px; color:var(--color-neutral-700)\">{{ p.tagged }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:2px\">\n                    <span style=\"font-family:ui-monospace, monospace; font-size:13.5px; font-weight:600\">{{ p.orders }}<\u002Fspan>\n                    <span style=\"font-size:12px; color:var(--color-neutral-700)\">{{ p.saves }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSquare }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"Square POS\" style=\"display:flex; flex-direction:column; gap:17.6px\">\n          <div>\n            <h1 style=\"font-family:var(--font-heading); font-weight:400; font-size:36px; line-height:1.15; margin:0\">Square POS<\u002Fh1>\n            <p style=\"margin:8px 0 0; font-size:15px; line-height:1.55; color:var(--color-neutral-700); max-width:66ch\">Pop-ups and markets. Stock comes out of the same pool as online, and cash counted by hand gets squared off here.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px\">\n            <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">Cash reconciliation<\u002Fh2>\n            <p style=\"margin:0 0 17.6px; font-size:13.5px; color:var(--color-neutral-700)\">{{ sqReconcileNote }}<\u002Fp>\n            <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:13.2px; margin-bottom:17.6px\">\n              <div style=\"background:var(--color-bg); border-radius:16px; padding:17.6px; display:flex; flex-direction:column; gap:4px\">\n                <span style=\"font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700)\">Counted by hand<\u002Fspan>\n                <span style=\"font-family:ui-monospace, monospace; font-size:24px; font-weight:600\">$412.00<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"background:var(--color-bg); border-radius:16px; padding:17.6px; display:flex; flex-direction:column; gap:4px\">\n                <span style=\"font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700)\">Recorded in Square<\u002Fspan>\n                <span style=\"font-family:ui-monospace, monospace; font-size:24px; font-weight:600\">{{ sqRecorded }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"background:var(--color-bg); border-radius:16px; padding:17.6px; display:flex; flex-direction:column; gap:4px\">\n                <span style=\"font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700)\">Difference<\u002Fspan>\n                <span style=\"font-family:ui-monospace, monospace; font-size:24px; font-weight:600; color:{{ sqDiffColor }}\">{{ sqDiff }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:8.8px; flex-wrap:wrap; align-items:center\">\n              <button class=\"btn btn-primary\" style=\"padding:10px 20px\" disabled=\"{{ sqFixed }}\" sc-camel-on-click=\"{{ acceptCount }}\">Trust the hand count<\u002Fbutton>\n              <button class=\"btn btn-secondary\" style=\"padding:10px 20px\" disabled=\"{{ sqFixed }}\" sc-camel-on-click=\"{{ acceptCount }}\">Log as shortfall<\u002Fbutton>\n              <span style=\"font-size:13px; color:var(--color-neutral-700)\">{{ sqFixedNote }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:8.8px 0; overflow-x:auto\">\n            <div style=\"padding:13.2px 26.4px 4px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0; font-size:24px\">Sessions<\u002Fh2>\n            <\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:100px minmax(150px,1.4fr) 72px 92px 92px 112px; gap:13.2px; padding:8px 26.4px 10px; min-width:800px; font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700); white-space:nowrap\">\n              <span>Date<\u002Fspan><span>Where<\u002Fspan><span>Items<\u002Fspan><span>Cash<\u002Fspan><span>Card<\u002Fspan><span>State<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ sqSessions }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"display:grid; grid-template-columns:100px minmax(150px,1.4fr) 72px 92px 92px 112px; gap:13.2px; align-items:center; padding:9px 26.4px; min-width:800px; border-top:1px solid var(--color-neutral-300); font-size:14px\">\n                <span style=\"font-size:13px\">{{ s.date }}<\u002Fspan>\n                <span style=\"min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ s.where }}<\u002Fspan>\n                <span style=\"font-family:ui-monospace, monospace; font-size:12.5px\">{{ s.items }}<\u002Fspan>\n                <span style=\"font-family:ui-monospace, monospace; font-size:12.5px\">{{ s.cash }}<\u002Fspan>\n                <span style=\"font-family:ui-monospace, monospace; font-size:12.5px\">{{ s.card }}<\u002Fspan>\n                <span class=\"tag {{ s.tag }}\" style=\"justify-self:start\">{{ s.state }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isPrintify }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"Printify production\" style=\"display:flex; flex-direction:column; gap:17.6px\">\n          <div>\n            <h1 style=\"font-family:var(--font-heading); font-weight:400; font-size:36px; line-height:1.15; margin:0\">Printify production<\u002Fh1>\n            <p style=\"margin:8px 0 0; font-size:15px; line-height:1.55; color:var(--color-neutral-700); max-width:66ch\">Shop 4471. Every order from every channel arrives here, gets made, and leaves with tracking attached.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:17.6px\">\n            <sc-for list=\"{{ pfStats }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"background:var(--color-surface); border-radius:28px; padding:22px; display:flex; flex-direction:column; gap:6px\">\n                <span style=\"font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700)\">{{ s.label }}<\u002Fspan>\n                <span style=\"font-family:var(--font-heading); font-weight:400; font-size:38px; line-height:1.25\">{{ s.value }}<\u002Fspan>\n                <span style=\"font-size:12.5px; color:var(--color-neutral-700)\">{{ s.note }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:8.8px 0; overflow-x:auto\">\n            <div style=\"padding:13.2px 26.4px 4px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0; font-size:24px\">Production queue<\u002Fh2>\n            <\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:96px minmax(180px,1.8fr) 132px 112px 116px 88px; gap:13.2px; padding:8px 26.4px 10px; min-width:900px; font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700); white-space:nowrap\">\n              <span>Order<\u002Fspan><span>Item<\u002Fspan><span>Provider<\u002Fspan><span>From<\u002Fspan><span>Stage<\u002Fspan><span>Ship by<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ pfQueue }}\" as=\"q\" hint-placeholder-count=\"6\">\n              <div style=\"display:grid; grid-template-columns:96px minmax(180px,1.8fr) 132px 112px 116px 88px; gap:13.2px; align-items:center; padding:9px 26.4px; min-width:900px; border-top:1px solid var(--color-neutral-300); font-size:14px\" style-hover=\"background:color-mix(in srgb, var(--color-accent) 8%, transparent)\">\n                <span style=\"font-family:ui-monospace, monospace; font-size:12.5px; font-weight:600\">{{ q.id }}<\u002Fspan>\n                <span style=\"min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ q.item }}<\u002Fspan>\n                <span style=\"font-size:13px; color:var(--color-neutral-700)\">{{ q.provider }}<\u002Fspan>\n                <span style=\"font-size:13px\">{{ q.from }}<\u002Fspan>\n                <span class=\"tag {{ q.tag }}\" style=\"justify-self:start\">{{ q.stage }}<\u002Fspan>\n                <span style=\"font-size:13px\">{{ q.shipBy }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:8.8px 0; overflow-x:auto\">\n            <div style=\"padding:13.2px 26.4px 4px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0; font-size:24px\">Blanks &amp; providers<\u002Fh2>\n            <\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:minmax(170px,1.6fr) 132px 80px 80px minmax(150px,1fr); gap:13.2px; padding:8px 26.4px 10px; min-width:820px; font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700); white-space:nowrap\">\n              <span>Blank<\u002Fspan><span>Provider<\u002Fspan><span>Cost<\u002Fspan><span>Stock<\u002Fspan><span>Note<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ pfBlanks }}\" as=\"b\" hint-placeholder-count=\"5\">\n              <div style=\"display:grid; grid-template-columns:minmax(170px,1.6fr) 132px 80px 80px minmax(150px,1fr); gap:13.2px; align-items:center; padding:9px 26.4px; min-width:820px; border-top:1px solid var(--color-neutral-300); font-size:14px\">\n                <span style=\"font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ b.name }}<\u002Fspan>\n                <span style=\"font-size:13px; color:var(--color-neutral-700)\">{{ b.provider }}<\u002Fspan>\n                <span style=\"font-family:ui-monospace, monospace; font-size:12.5px\">{{ b.cost }}<\u002Fspan>\n                <span style=\"font-family:ui-monospace, monospace; font-size:12.5px; color:{{ b.stockColor }}\">{{ b.stock }}<\u002Fspan>\n                <span style=\"font-size:12.5px; color:var(--color-neutral-700); min-width:0\">{{ b.note }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isLibrary }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"Asset library\" style=\"display:flex; flex-direction:column; gap:17.6px\">\n          <div style=\"display:flex; align-items:flex-end; gap:26.4px; flex-wrap:wrap\">\n            <div style=\"flex:1; min-width:0\">\n              <h1 style=\"font-family:var(--font-heading); font-weight:400; font-size:36px; line-height:1.15; margin:0\">Asset library<\u002Fh1>\n              <p style=\"margin:8px 0 0; font-size:15px; line-height:1.55; color:var(--color-neutral-700); max-width:66ch\">Everything you made in other apps, with a record of where each file actually ended up.<\u002Fp>\n            <\u002Fdiv>\n            <button class=\"btn btn-primary\" style=\"flex:none; padding:11px 20px\" sc-camel-on-click=\"{{ goHub }}\">Route new files<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px\">\n            <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">Recent assets<\u002Fh2>\n            <p style=\"margin:0 0 17.6px; font-size:13.5px; color:var(--color-neutral-700)\">Placeholders until you drop the real files in.<\u002Fp>\n            <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:17.6px\">\n              <sc-for list=\"{{ libAssets }}\" as=\"a\" hint-placeholder-count=\"6\">\n                <div style=\"display:flex; flex-direction:column; gap:8px\">\n                  <span style=\"display:flex; align-items:center; justify-content:center; aspect-ratio:1; border-radius:16px; background:repeating-linear-gradient(135deg, var(--color-neutral-300) 0 9px, var(--color-neutral-200) 9px 18px)\">\n                    <span style=\"font-family:ui-monospace, monospace; font-size:11px; color:var(--color-neutral-700); background:var(--color-bg); padding:5px 10px; border-radius:999px\">{{ a.kind }}<\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"font-family:ui-monospace, monospace; font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ a.name }}<\u002Fspan>\n                  <span style=\"font-size:12px; line-height:1.4; color:var(--color-neutral-700)\">{{ a.usedIn }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px; max-width:760px\">\n            <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">Recent placements<\u002Fh2>\n            <p style=\"margin:0 0 8.8px; font-size:13.5px; color:var(--color-neutral-700)\">What the inbox sent where.<\u002Fp>\n            <sc-for list=\"{{ libPlacements }}\" as=\"p\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex; align-items:center; gap:13.2px; padding:10px 0; border-top:1px solid var(--color-neutral-300); flex-wrap:wrap\">\n                <span style=\"font-family:ui-monospace, monospace; font-size:12.5px; flex:1; min-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ p.file }}<\u002Fspan>\n                <span style=\"font-size:13px; color:var(--color-neutral-700); flex:none\">{{ p.dest }}<\u002Fspan>\n                <span style=\"font-size:12px; color:var(--color-neutral-600); flex:none\">{{ p.when }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSocial }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"Social calendar\" style=\"display:flex; flex-direction:column; gap:17.6px\">\n          <div>\n            <h1 style=\"font-family:var(--font-heading); font-weight:400; font-size:36px; line-height:1.15; margin:0\">Social calendar<\u002Fh1>\n            <p style=\"margin:8px 0 0; font-size:15px; line-height:1.55; color:var(--color-neutral-700); max-width:66ch\">This week across Instagram, Facebook and TikTok. You design elsewhere — here it gets scheduled, approved and tracked.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px; overflow-x:auto\">\n            <div style=\"display:grid; grid-template-columns:repeat(7, minmax(150px,1fr)); gap:13.2px; min-width:1140px\">\n              <sc-for list=\"{{ calDays }}\" as=\"d\" hint-placeholder-count=\"7\">\n                <div style=\"background:{{ d.bg }}; border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:10px; min-height:200px\">\n                  <div style=\"display:flex; align-items:baseline; gap:6px\">\n                    <span style=\"font-size:13px; font-weight:700\">{{ d.day }}<\u002Fspan>\n                    <span style=\"font-size:12px; color:var(--color-neutral-600)\">{{ d.date }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ d.posts }}\" as=\"p\" hint-placeholder-count=\"1\">\n                    <div style=\"background:var(--color-surface); border-radius:12px; padding:9px 11px; display:flex; flex-direction:column; gap:4px\">\n                      <span style=\"font-family:ui-monospace, monospace; font-size:10.5px; color:var(--color-neutral-600)\">{{ p.when }}<\u002Fspan>\n                      <span style=\"font-size:12.5px; font-weight:600; line-height:1.3\">{{ p.title }}<\u002Fspan>\n                      <span class=\"tag {{ p.tag }}\" style=\"align-self:flex-start; font-size:10.5px; padding:2px 9px\">{{ p.state }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px; max-width:760px\">\n            <div style=\"display:flex; align-items:baseline; gap:10px; margin-bottom:4px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0; font-size:24px\">Waiting on you<\u002Fh2>\n              <span class=\"tag tag-accent\">{{ approvalCount }}<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 8.8px; font-size:13.5px; color:var(--color-neutral-700)\">Nothing posts without an approval.<\u002Fp>\n            <sc-for list=\"{{ approvals }}\" as=\"a\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex; align-items:center; gap:13.2px; padding:12px 0; border-top:1px solid var(--color-neutral-300); flex-wrap:wrap\">\n                <span style=\"width:40px; height:40px; flex:none; border-radius:12px; background:repeating-linear-gradient(135deg, var(--color-neutral-300) 0 6px, var(--color-neutral-200) 6px 12px)\"><\u002Fspan>\n                <div style=\"flex:1; min-width:140px; display:flex; flex-direction:column; gap:2px\">\n                  <span style=\"font-size:14px; font-weight:600\">{{ a.title }}<\u002Fspan>\n                  <span style=\"font-size:12.5px; color:var(--color-neutral-700)\">{{ a.where }}<\u002Fspan>\n                <\u002Fdiv>\n                <button class=\"btn btn-primary\" style=\"flex:none; padding:8px 16px; font-size:13px\" sc-camel-on-click=\"{{ a.approve }}\">Approve<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ approvalsClear }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border-top:1px solid var(--color-neutral-300); padding:26.4px 0 4px; text-align:center\">\n                <span style=\"font-family:var(--font-heading); font-weight:400; font-size:22px\">All clear — the week posts itself.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isAds }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"Campaigns\" style=\"display:flex; flex-direction:column; gap:17.6px\">\n          <div>\n            <h1 style=\"font-family:var(--font-heading); font-weight:400; font-size:36px; line-height:1.15; margin:0\">Campaigns<\u002Fh1>\n            <p style=\"margin:8px 0 0; font-size:15px; line-height:1.55; color:var(--color-neutral-700); max-width:66ch\">Paid, email and SMS in one list, each beside the creative it runs on and the money it brought back.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:17.6px\">\n            <sc-for list=\"{{ adStats }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"background:var(--color-surface); border-radius:28px; padding:22px; display:flex; flex-direction:column; gap:6px\">\n                <span style=\"font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700)\">{{ s.label }}<\u002Fspan>\n                <span style=\"font-family:var(--font-heading); font-weight:400; font-size:38px; line-height:1.25\">{{ s.value }}<\u002Fspan>\n                <span style=\"font-size:12.5px; color:var(--color-neutral-700)\">{{ s.note }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:8.8px 0; overflow-x:auto\">\n            <div style=\"display:grid; grid-template-columns:minmax(180px,1.8fr) 108px 96px 96px 76px 116px; gap:13.2px; padding:17.6px 26.4px 10px; min-width:860px; font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700); white-space:nowrap\">\n              <span>Campaign<\u002Fspan><span>Channel<\u002Fspan><span>Spend<\u002Fspan><span>Revenue<\u002Fspan><span>ROAS<\u002Fspan><span>State<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ campaigns }}\" as=\"c\" hint-placeholder-count=\"5\">\n              <div style=\"display:grid; grid-template-columns:minmax(180px,1.8fr) 108px 96px 96px 76px 116px; gap:13.2px; align-items:center; padding:9px 26.4px; min-width:860px; border-top:1px solid var(--color-neutral-300); font-size:14px\">\n                <div style=\"display:flex; flex-direction:column; min-width:0\">\n                  <span style=\"font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ c.name }}<\u002Fspan>\n                  <span style=\"font-family:ui-monospace, monospace; font-size:11.5px; color:var(--color-neutral-600); overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ c.asset }}<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-size:13px\">{{ c.channel }}<\u002Fspan>\n                <span style=\"font-family:ui-monospace, monospace; font-size:12.5px\">{{ c.spend }}<\u002Fspan>\n                <span style=\"font-family:ui-monospace, monospace; font-size:12.5px\">{{ c.revenue }}<\u002Fspan>\n                <span style=\"font-family:ui-monospace, monospace; font-size:12.5px; font-weight:600; color:{{ c.roasColor }}\">{{ c.roas }}<\u002Fspan>\n                <span class=\"tag {{ c.tag }}\" style=\"justify-self:start\">{{ c.state }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isBrand }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"Brand kit\" style=\"display:flex; flex-direction:column; gap:17.6px\">\n          <div>\n            <h1 style=\"font-family:var(--font-heading); font-weight:400; font-size:36px; line-height:1.15; margin:0\">Brand kit<\u002Fh1>\n            <p style=\"margin:8px 0 0; font-size:15px; line-height:1.55; color:var(--color-neutral-700); max-width:66ch\">The signature, the palette and the rules — so a collaborator can't get it wrong.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(400px,1fr)); gap:17.6px; align-items:start\">\n            <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px; display:flex; flex-direction:column; gap:17.6px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0; font-size:24px\">Type<\u002Fh2>\n              <div style=\"background:var(--color-bg); border-radius:16px; padding:22px; display:flex; flex-direction:column; gap:10px\">\n                <span style=\"font-family:var(--font-heading); font-weight:400; font-size:38px; line-height:1.1\">Saucy Streetwear<\u002Fspan>\n                <span style=\"font-size:12.5px; color:var(--color-neutral-700)\">Pacifico — signature. Logo, headlines, drop names. Never below 20px.<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"background:var(--color-bg); border-radius:16px; padding:22px; display:flex; flex-direction:column; gap:10px\">\n                <span style=\"font-size:22px; font-weight:600\">Heavyweight fleece, cut boxy<\u002Fspan>\n                <span style=\"font-size:12.5px; color:var(--color-neutral-700)\">Figtree — everything else. Product copy, interface, captions.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px; display:flex; flex-direction:column; gap:17.6px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0; font-size:24px\">Palette<\u002Fh2>\n              <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(120px,1fr)); gap:13.2px\">\n                <sc-for list=\"{{ brandColors }}\" as=\"c\" hint-placeholder-count=\"5\">\n                  <div style=\"display:flex; flex-direction:column; gap:6px\">\n                    <span style=\"height:64px; border-radius:16px; display:block; background:{{ c.hex }}\"><\u002Fspan>\n                    <span style=\"font-size:13px; font-weight:600\">{{ c.name }}<\u002Fspan>\n                    <span style=\"font-family:ui-monospace, monospace; font-size:11.5px; color:var(--color-neutral-700)\">{{ c.hex }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"border-top:1px solid var(--color-neutral-300); padding-top:13.2px; display:flex; flex-direction:column; gap:8px\">\n                <sc-for list=\"{{ brandRules }}\" as=\"r\" hint-placeholder-count=\"3\">\n                  <span style=\"font-size:13px; line-height:1.5; color:var(--color-neutral-700)\">{{ r.text }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isPages }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"Pages\" style=\"display:flex; flex-direction:column; gap:17.6px\">\n          <div>\n            <h1 style=\"font-family:var(--font-heading); font-weight:400; font-size:36px; line-height:1.15; margin:0\">Pages<\u002Fh1>\n            <p style=\"margin:8px 0 0; font-size:15px; line-height:1.55; color:var(--color-neutral-700); max-width:66ch\">Every page on saucystreetwear.com, its publish state, and what it's carrying.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:8.8px 0; overflow-x:auto\">\n            <div style=\"display:grid; grid-template-columns:minmax(170px,1.6fr) minmax(140px,1.2fr) 96px 100px 112px; gap:13.2px; padding:17.6px 26.4px 10px; min-width:820px; font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700); white-space:nowrap\">\n              <span>Page<\u002Fspan><span>Path<\u002Fspan><span>Views 7d<\u002Fspan><span>Conversion<\u002Fspan><span>State<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ pages }}\" as=\"p\" hint-placeholder-count=\"7\">\n              <div style=\"display:grid; grid-template-columns:minmax(170px,1.6fr) minmax(140px,1.2fr) 96px 100px 112px; gap:13.2px; align-items:center; padding:9px 26.4px; min-width:820px; border-top:1px solid var(--color-neutral-300); font-size:14px\" style-hover=\"background:color-mix(in srgb, var(--color-accent) 8%, transparent)\">\n                <span style=\"font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ p.name }}<\u002Fspan>\n                <span style=\"font-family:ui-monospace, monospace; font-size:11.5px; color:var(--color-neutral-600); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ p.path }}<\u002Fspan>\n                <span style=\"font-family:ui-monospace, monospace; font-size:12.5px\">{{ p.views }}<\u002Fspan>\n                <span style=\"font-family:ui-monospace, monospace; font-size:12.5px\">{{ p.conv }}<\u002Fspan>\n                <span class=\"tag {{ p.tag }}\" style=\"justify-self:start\">{{ p.state }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px; max-width:720px\">\n            <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">Needs attention<\u002Fh2>\n            <p style=\"margin:0 0 8.8px; font-size:13.5px; color:var(--color-neutral-700)\">Broken links and missing images, found on the last crawl.<\u002Fp>\n            <sc-for list=\"{{ pageIssues }}\" as=\"i\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex; align-items:center; gap:13.2px; padding:11px 0; border-top:1px solid var(--color-neutral-300)\">\n                <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:2px\">\n                  <span style=\"font-size:14px; font-weight:600\">{{ i.what }}<\u002Fspan>\n                  <span style=\"font-family:ui-monospace, monospace; font-size:11.5px; color:var(--color-neutral-600)\">{{ i.where }}<\u002Fspan>\n                <\u002Fdiv>\n                <span class=\"tag {{ i.tag }}\" style=\"flex:none\">{{ i.state }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isAnalytics }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"Analytics\" style=\"display:flex; flex-direction:column; gap:17.6px\">\n          <div>\n            <h1 style=\"font-family:var(--font-heading); font-weight:400; font-size:36px; line-height:1.15; margin:0\">Analytics<\u002Fh1>\n            <p style=\"margin:8px 0 0; font-size:15px; line-height:1.55; color:var(--color-neutral-700); max-width:66ch\">Traffic and conversion for the site and every sales channel, side by side and on the same definitions.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:17.6px\">\n            <sc-for list=\"{{ anStats }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"background:var(--color-surface); border-radius:28px; padding:22px; display:flex; flex-direction:column; gap:6px\">\n                <span style=\"font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700)\">{{ s.label }}<\u002Fspan>\n                <span style=\"font-family:var(--font-heading); font-weight:400; font-size:38px; line-height:1.25\">{{ s.value }}<\u002Fspan>\n                <span style=\"font-size:12.5px; color:var(--color-neutral-700)\">{{ s.note }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ analyticsLight }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px; max-width:760px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">Top posts this week<\u002Fh2>\n              <p style=\"margin:0 0 8.8px; font-size:13.5px; color:var(--color-neutral-700)\">The headline version — ranked by traffic they sent.<\u002Fp>\n              <sc-for list=\"{{ lightSources }}\" as=\"s\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex; align-items:center; gap:13.2px; padding:11px 0; border-top:1px solid var(--color-neutral-300)\">\n                  <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:2px\">\n                    <span style=\"font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ s.name }}<\u002Fspan>\n                    <span style=\"font-size:12.5px; color:var(--color-neutral-700)\">{{ s.kind }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <span style=\"font-family:ui-monospace, monospace; font-size:13.5px; font-weight:600; flex:none\">{{ s.sessions }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"border-top:1px solid var(--color-neutral-300); margin-top:8.8px; padding-top:13.2px; display:flex; align-items:center; gap:13.2px; flex-wrap:wrap\">\n                <span style=\"font-size:13px; color:var(--color-neutral-700); flex:1; min-width:180px\">Growth numbers are the fun ones.<\u002Fspan>\n                <button class=\"btn btn-primary\" style=\"flex:none; padding:9px 18px; font-size:13px\" sc-camel-on-click=\"{{ goGrowth }}\">See brand growth<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display:{{ fullAnalyticsDisplay }}; grid-template-columns:repeat(auto-fit, minmax(420px,1fr)); gap:17.6px; align-items:start\">\n            <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">Funnel by channel<\u002Fh2>\n              <p style=\"margin:0 0 8.8px; font-size:13.5px; color:var(--color-neutral-700)\">Sessions → cart → paid, last 7 days.<\u002Fp>\n              <sc-for list=\"{{ funnel }}\" as=\"f\" hint-placeholder-count=\"4\">\n                <div style=\"padding:13.2px 0; border-top:1px solid var(--color-neutral-300); display:flex; flex-direction:column; gap:8px\">\n                  <div style=\"display:flex; align-items:baseline; gap:10px\">\n                    <span style=\"font-size:14px; font-weight:600; flex:1; min-width:0\">{{ f.name }}<\u002Fspan>\n                    <span style=\"font-family:ui-monospace, monospace; font-size:12.5px; color:var(--color-neutral-700)\">{{ f.detail }}<\u002Fspan>\n                    <span style=\"font-family:ui-monospace, monospace; font-size:13.5px; font-weight:600\">{{ f.rate }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <span style=\"height:8px; border-radius:999px; background:var(--color-neutral-300); display:block; overflow:hidden\">\n                    <span style=\"display:block; height:8px; border-radius:999px; background:var(--color-accent); width:{{ f.bar }}\"><\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">What sent the traffic<\u002Fh2>\n              <p style=\"margin:0 0 8.8px; font-size:13.5px; color:var(--color-neutral-700)\">Posts and campaigns, credited to the order.<\u002Fp>\n              <sc-for list=\"{{ sources }}\" as=\"s\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex; align-items:center; gap:13.2px; padding:11px 0; border-top:1px solid var(--color-neutral-300)\">\n                  <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:2px\">\n                    <span style=\"font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ s.name }}<\u002Fspan>\n                    <span style=\"font-size:12.5px; color:var(--color-neutral-700)\">{{ s.kind }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:2px\">\n                    <span style=\"font-family:ui-monospace, monospace; font-size:13.5px; font-weight:600\">{{ s.revenue }}<\u002Fspan>\n                    <span style=\"font-size:12px; color:var(--color-neutral-700)\">{{ s.sessions }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isDomains }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"Domains &amp; SSL\" style=\"display:flex; flex-direction:column; gap:17.6px\">\n          <div>\n            <h1 style=\"font-family:var(--font-heading); font-weight:400; font-size:36px; line-height:1.15; margin:0\">Domains &amp; SSL<\u002Fh1>\n            <p style=\"margin:8px 0 0; font-size:15px; line-height:1.55; color:var(--color-neutral-700); max-width:66ch\">Registrations, certificates and DNS. Read-only until you unlock a record — DNS is the one place a wrong click costs you the store.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:17.6px\">\n            <sc-for list=\"{{ domainCards }}\" as=\"d\" hint-placeholder-count=\"3\">\n              <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px\">\n                <div style=\"display:flex; align-items:center; gap:13.2px; flex-wrap:wrap; margin-bottom:13.2px\">\n                  <span style=\"font-family:ui-monospace, monospace; font-size:16px; font-weight:600\">{{ d.domain }}<\u002Fspan>\n                  <span class=\"tag {{ d.tag }}\">{{ d.state }}<\u002Fspan>\n                  <span style=\"flex:1\"><\u002Fspan>\n                  <button class=\"btn btn-secondary\" style=\"padding:8px 16px; font-size:13px\" disabled=\"{{ d.actionDone }}\" sc-camel-on-click=\"{{ d.act }}\">{{ d.action }}<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:13.2px\">\n                  <sc-for list=\"{{ d.facts }}\" as=\"f\" hint-placeholder-count=\"4\">\n                    <div style=\"background:var(--color-bg); border-radius:16px; padding:14px 17.6px; display:flex; flex-direction:column; gap:3px\">\n                      <span style=\"font-size:10.5px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700)\">{{ f.label }}<\u002Fspan>\n                      <span style=\"font-size:14px; font-weight:600\">{{ f.value }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isAutoSync }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"Auto-sync rules\" style=\"display:flex; flex-direction:column; gap:17.6px\">\n          <div>\n            <h1 style=\"font-family:var(--font-heading); font-weight:400; font-size:36px; line-height:1.15; margin:0\">Auto-sync rules<\u002Fh1>\n            <p style=\"margin:8px 0 0; font-size:15px; line-height:1.55; color:var(--color-neutral-700); max-width:68ch\">Change something anywhere — a price on GoDaddy, a cost at Printify, an image in the library — and the bridge pushes it to every other channel. These rules decide what goes automatically and what waits for you.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px; display:flex; align-items:center; gap:17.6px; flex-wrap:wrap\">\n            <button sc-camel-on-click=\"{{ toggleAuto }}\" style=\"display:flex; align-items:center; gap:14px; font:inherit; cursor:pointer; background:transparent; border:0; padding:0; text-align:left\">\n              <span style=\"width:52px; height:28px; flex:none; border-radius:999px; position:relative; transition:background 160ms; background:{{ autoTrackBg }}\">\n                <span style=\"position:absolute; top:4px; width:20px; height:20px; border-radius:999px; transition:left 160ms; background:{{ autoKnobBg }}; left:{{ autoKnobLeft }}\"><\u002Fspan>\n              <\u002Fspan>\n              <span style=\"display:flex; flex-direction:column; gap:2px\">\n                <span style=\"font-family:var(--font-heading); font-weight:400; font-size:24px\">{{ autoTitle }}<\u002Fspan>\n                <span style=\"font-size:13px; color:var(--color-neutral-700)\">{{ autoNote }}<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fbutton>\n            <span style=\"flex:1\"><\u002Fspan>\n            <div class=\"field\" style=\"min-width:190px\">\n              <label>Push changes<\u002Flabel>\n              <div class=\"seg\">\n                <sc-for list=\"{{ propSpeeds }}\" as=\"p\" hint-placeholder-count=\"3\">\n                  <label class=\"seg-opt\" style=\"background:{{ p.bg }}; color:{{ p.fg }}\">\n                    <input type=\"radio\" name=\"propspeed\" sc-camel-on-change=\"{{ p.pick }}\">\n                    <span>{{ p.label }}<\u002Fspan>\n                  <\u002Flabel>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px\">\n            <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">Who wins<\u002Fh2>\n            <p style=\"margin:0 0 17.6px; font-size:13.5px; color:var(--color-neutral-700)\">One source of truth per field. Everything else gets overwritten to match it.<\u002Fp>\n            <div style=\"display:flex; flex-direction:column; gap:8.8px\">\n              <sc-for list=\"{{ truthRows }}\" as=\"t\" hint-placeholder-count=\"6\">\n                <div style=\"border-top:1px solid var(--color-neutral-300); padding-top:13.2px; display:flex; align-items:center; gap:17.6px; flex-wrap:wrap\">\n                  <div style=\"flex:1; min-width:170px; display:flex; flex-direction:column; gap:2px\">\n                    <span style=\"font-size:14.5px; font-weight:600\">{{ t.field }}<\u002Fspan>\n                    <span style=\"font-size:12.5px; line-height:1.4; color:var(--color-neutral-700)\">{{ t.note }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div class=\"seg\" style=\"flex:none\">\n                    <sc-for list=\"{{ t.options }}\" as=\"o\" hint-placeholder-count=\"3\">\n                      <label class=\"seg-opt\" style=\"background:{{ o.bg }}; color:{{ o.fg }}\">\n                        <input type=\"radio\" name=\"{{ t.group }}\" sc-camel-on-change=\"{{ o.pick }}\">\n                        <span>{{ o.label }}<\u002Fspan>\n                      <\u002Flabel>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px; overflow-x:auto\">\n            <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">Fan-out<\u002Fh2>\n            <p style=\"margin:0 0 17.6px; font-size:13.5px; color:var(--color-neutral-700)\">Tap a cell: auto-push, hold for review, or never touch it. {{ fanoutSummary }}<\u002Fp>\n            <div style=\"min-width:760px\">\n              <div style=\"display:grid; grid-template-columns:minmax(150px,1.3fr) repeat(4, 1fr); gap:10px; padding-bottom:10px; font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--color-accent-700)\">\n                <span>Change<\u002Fspan><span>GoDaddy<\u002Fspan><span>TikTok<\u002Fspan><span>IG / FB<\u002Fspan><span>Square<\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ fanRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n                <div style=\"display:grid; grid-template-columns:minmax(150px,1.3fr) repeat(4, 1fr); gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--color-neutral-300)\">\n                  <span style=\"font-size:14px; font-weight:600; min-width:0\">{{ r.label }}<\u002Fspan>\n                  <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"4\">\n                    <button sc-camel-on-click=\"{{ c.cycle }}\" style=\"font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; padding:9px 6px; border:0; border-radius:12px; background:{{ c.bg }}; color:{{ c.fg }}\">{{ c.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px\">\n            <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">Held for review<\u002Fh2>\n            <p style=\"margin:0 0 8.8px; font-size:13.5px; color:var(--color-neutral-700)\">Changes the rules caught instead of pushing.<\u002Fp>\n            <sc-for list=\"{{ heldChanges }}\" as=\"h\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex; align-items:center; gap:13.2px; padding:12px 0; border-top:1px solid var(--color-neutral-300); flex-wrap:wrap\">\n                <div style=\"flex:1; min-width:180px; display:flex; flex-direction:column; gap:2px\">\n                  <span style=\"font-size:14px; font-weight:600\">{{ h.what }}<\u002Fspan>\n                  <span style=\"font-size:12.5px; line-height:1.4; color:var(--color-neutral-700)\">{{ h.why }}<\u002Fspan>\n                <\u002Fdiv>\n                <button class=\"btn btn-primary\" style=\"flex:none; padding:8px 16px; font-size:13px\" sc-camel-on-click=\"{{ h.push }}\">Push it<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ heldClear }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border-top:1px solid var(--color-neutral-300); padding:26.4px 0 4px; text-align:center\">\n                <span style=\"font-family:var(--font-heading); font-weight:400; font-size:22px\">Nothing held. Everything's in step.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isTeam }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"Team &amp; access\" style=\"display:flex; flex-direction:column; gap:17.6px\">\n          <div>\n            <h1 style=\"font-family:var(--font-heading); font-weight:400; font-size:36px; line-height:1.15; margin:0\">Team &amp; access<\u002Fh1>\n            <p style=\"margin:8px 0 0; font-size:15px; line-height:1.55; color:var(--color-neutral-700); max-width:68ch\">Three seats. Everyone sees what they need and nothing that would let them break the store by accident.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:17.6px\">\n            <sc-for list=\"{{ teamCards }}\" as=\"m\" hint-placeholder-count=\"3\">\n              <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px; display:flex; flex-direction:column; gap:13.2px\">\n                <div style=\"display:flex; align-items:center; gap:13.2px\">\n                  <span style=\"width:48px; height:48px; flex:none; border-radius:999px; display:flex; align-items:center; justify-content:center; font-family:var(--font-heading); font-size:19px; background:{{ m.dotBg }}; color:{{ m.dotFg }}\">{{ m.initial }}<\u002Fspan>\n                  <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:2px\">\n                    <span style=\"font-size:16px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ m.name }}<\u002Fspan>\n                    <span style=\"font-size:12.5px; color:var(--color-neutral-700)\">{{ m.role }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font-size:13px; line-height:1.5; color:var(--color-neutral-700)\">{{ m.blurb }}<\u002Fspan>\n                <div style=\"display:flex; flex-wrap:wrap; gap:6px\">\n                  <sc-for list=\"{{ m.chips }}\" as=\"c\" hint-placeholder-count=\"3\">\n                    <span class=\"tag {{ c.tag }}\">{{ c.label }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <span style=\"font-family:ui-monospace, monospace; font-size:11.5px; color:var(--color-neutral-600); border-top:1px solid var(--color-neutral-300); padding-top:10px\">{{ m.seen }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px; overflow-x:auto\">\n            <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">What each seat can do<\u002Fh2>\n            <p style=\"margin:0 0 17.6px; font-size:13.5px; color:var(--color-neutral-700)\">Tap a cell to cycle none → view → edit. {{ permSummary }}<\u002Fp>\n            <div style=\"min-width:620px\">\n              <div style=\"display:grid; grid-template-columns:minmax(160px,1.4fr) repeat(3, 1fr); gap:10px; padding-bottom:10px; font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--color-accent-700)\">\n                <span>Area<\u002Fspan>\n                <sc-for list=\"{{ permHeads }}\" as=\"h\" hint-placeholder-count=\"3\">\n                  <span style=\"overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ h.label }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-for list=\"{{ permRows }}\" as=\"r\" hint-placeholder-count=\"7\">\n                <div style=\"display:grid; grid-template-columns:minmax(160px,1.4fr) repeat(3, 1fr); gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--color-neutral-300)\">\n                  <span style=\"font-size:14px; font-weight:600; min-width:0\">{{ r.label }}<\u002Fspan>\n                  <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"3\">\n                    <button sc-camel-on-click=\"{{ c.cycle }}\" disabled=\"{{ c.locked }}\" style=\"font:inherit; font-size:12.5px; font-weight:600; cursor:{{ c.cursor }}; padding:9px 6px; border:0; border-radius:12px; background:{{ c.bg }}; color:{{ c.fg }}\">{{ c.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px; max-width:760px\">\n            <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">Recent activity by seat<\u002Fh2>\n            <p style=\"margin:0 0 8.8px; font-size:13.5px; color:var(--color-neutral-700)\">Who changed what, so nothing is a mystery later.<\u002Fp>\n            <sc-for list=\"{{ seatActivity }}\" as=\"a\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex; align-items:center; gap:13.2px; padding:10px 0; border-top:1px solid var(--color-neutral-300); flex-wrap:wrap\">\n                <span style=\"font-family:ui-monospace, monospace; font-size:11.5px; color:var(--color-neutral-600); flex:none; width:64px\">{{ a.time }}<\u002Fspan>\n                <span style=\"font-size:13px; font-weight:600; flex:none; width:76px\">{{ a.who }}<\u002Fspan>\n                <span style=\"font-size:13.5px; flex:1; min-width:140px\">{{ a.what }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isGrowth }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"Brand growth\" style=\"display:flex; flex-direction:column; gap:17.6px\">\n          <div>\n            <h1 style=\"font-family:var(--font-heading); font-weight:400; font-size:36px; line-height:1.15; margin:0\">Brand growth<\u002Fh1>\n            <p style=\"margin:8px 0 0; font-size:15px; line-height:1.55; color:var(--color-neutral-700); max-width:68ch\">{{ growthBlurb }}<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:17.6px\">\n            <sc-for list=\"{{ growthStats }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"background:var(--color-surface); border-radius:28px; padding:22px; display:flex; flex-direction:column; gap:6px\">\n                <span style=\"font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700)\">{{ s.label }}<\u002Fspan>\n                <span style=\"font-family:var(--font-heading); font-weight:400; font-size:38px; line-height:1.25\">{{ s.value }}<\u002Fspan>\n                <span style=\"font-size:12.5px; color:var(--color-neutral-700)\">{{ s.note }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px\">\n            <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">Six months<\u002Fh2>\n            <p style=\"margin:0 0 17.6px; font-size:13.5px; color:var(--color-neutral-700)\">Followers, list and revenue on the same timeline.<\u002Fp>\n            <div style=\"display:flex; align-items:flex-end; gap:13.2px; height:180px\">\n              <sc-for list=\"{{ growthBars }}\" as=\"b\" hint-placeholder-count=\"6\">\n                <div style=\"flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; height:100%; justify-content:flex-end\">\n                  <span style=\"font-family:ui-monospace, monospace; font-size:11.5px; color:var(--color-neutral-700)\">{{ b.value }}<\u002Fspan>\n                  <span style=\"width:100%; border-radius:12px 12px 0 0; background:var(--color-accent); display:block; height:{{ b.h }}\"><\u002Fspan>\n                  <span style=\"font-size:12px; font-weight:600\">{{ b.month }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(400px,1fr)); gap:17.6px; align-items:start\">\n            <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">What's working<\u002Fh2>\n              <p style=\"margin:0 0 8.8px; font-size:13.5px; color:var(--color-neutral-700)\">Ranked by new followers and list sign-ups, not just views.<\u002Fp>\n              <sc-for list=\"{{ growthWins }}\" as=\"w\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex; align-items:center; gap:13.2px; padding:11px 0; border-top:1px solid var(--color-neutral-300)\">\n                  <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:2px\">\n                    <span style=\"font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ w.name }}<\u002Fspan>\n                    <span style=\"font-size:12.5px; color:var(--color-neutral-700)\">{{ w.kind }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <span style=\"font-family:ui-monospace, monospace; font-size:13.5px; font-weight:600; flex:none\">{{ w.gain }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">Audience<\u002Fh2>\n              <p style=\"margin:0 0 8.8px; font-size:13.5px; color:var(--color-neutral-700)\">Where the following actually lives.<\u002Fp>\n              <sc-for list=\"{{ audience }}\" as=\"a\" hint-placeholder-count=\"4\">\n                <div style=\"padding:11px 0; border-top:1px solid var(--color-neutral-300); display:flex; flex-direction:column; gap:8px\">\n                  <div style=\"display:flex; align-items:baseline; gap:10px\">\n                    <span style=\"font-size:14px; font-weight:600; flex:1; min-width:0\">{{ a.name }}<\u002Fspan>\n                    <span style=\"font-family:ui-monospace, monospace; font-size:13px\">{{ a.count }}<\u002Fspan>\n                    <span style=\"font-size:12.5px; color:var(--color-neutral-700)\">{{ a.delta }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <span style=\"height:8px; border-radius:999px; background:var(--color-neutral-300); display:block; overflow:hidden\">\n                    <span style=\"display:block; height:8px; border-radius:999px; background:{{ a.color }}; width:{{ a.bar }}\"><\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isDiag }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"Diagnostics\" style=\"display:flex; flex-direction:column; gap:17.6px\">\n          <div style=\"display:flex; align-items:flex-end; gap:26.4px; flex-wrap:wrap\">\n            <div style=\"flex:1; min-width:0\">\n              <h1 style=\"font-family:var(--font-heading); font-weight:400; font-size:36px; line-height:1.15; margin:0\">Diagnostics<\u002Fh1>\n              <p style=\"margin:8px 0 0; font-size:15px; line-height:1.55; color:var(--color-neutral-700); max-width:68ch\">Master only. Every connection, token and webhook the app depends on — tested, timed, and retryable from here.<\u002Fp>\n            <\u002Fdiv>\n            <button class=\"btn btn-primary\" style=\"flex:none; padding:11px 20px\" disabled=\"{{ diagRunning }}\" sc-camel-on-click=\"{{ runDiagnostics }}\">{{ diagButtonLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:17.6px\">\n            <sc-for list=\"{{ diagStats }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"background:var(--color-surface); border-radius:28px; padding:22px; display:flex; flex-direction:column; gap:6px\">\n                <span style=\"font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700)\">{{ s.label }}<\u002Fspan>\n                <span style=\"font-family:var(--font-heading); font-weight:400; font-size:38px; line-height:1.25; color:{{ s.color }}\">{{ s.value }}<\u002Fspan>\n                <span style=\"font-size:12.5px; color:var(--color-neutral-700)\">{{ s.note }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:8.8px 0; overflow-x:auto; outline:{{ hlDiag }}; outline-offset:4px\">\n            <div style=\"padding:17.6px 26.4px 4px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0; font-size:24px\">Connection checks<\u002Fh2>\n            <\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:minmax(170px,1.6fr) minmax(160px,1.4fr) 84px 108px 104px; gap:13.2px; padding:8px 26.4px 10px; min-width:820px; font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700); white-space:nowrap\">\n              <span>Check<\u002Fspan><span>Detail<\u002Fspan><span>Latency<\u002Fspan><span>Result<\u002Fspan><span><\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ diagChecks }}\" as=\"c\" hint-placeholder-count=\"8\">\n              <div style=\"display:grid; grid-template-columns:minmax(170px,1.6fr) minmax(160px,1.4fr) 84px 108px 104px; gap:13.2px; align-items:center; padding:9px 26.4px; min-width:820px; border-top:1px solid var(--color-neutral-300); font-size:14px\">\n                <span style=\"font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ c.name }}<\u002Fspan>\n                <span style=\"font-size:12.5px; color:var(--color-neutral-700); min-width:0\">{{ c.detail }}<\u002Fspan>\n                <span style=\"font-family:ui-monospace, monospace; font-size:12.5px\">{{ c.latency }}<\u002Fspan>\n                <span class=\"tag {{ c.tag }}\" style=\"justify-self:start\">{{ c.state }}<\u002Fspan>\n                <button class=\"btn btn-secondary\" style=\"padding:6px 12px; font-size:12.5px; justify-self:start\" disabled=\"{{ c.fixDisabled }}\" sc-camel-on-click=\"{{ c.fix }}\">{{ c.fixLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(400px,1fr)); gap:17.6px; align-items:start\">\n            <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">Recent errors<\u002Fh2>\n              <p style=\"margin:0 0 8.8px; font-size:13.5px; color:var(--color-neutral-700)\">With the code, so you can hand it to support verbatim.<\u002Fp>\n              <sc-for list=\"{{ diagErrors }}\" as=\"e\" hint-placeholder-count=\"4\">\n                <div style=\"padding:12px 0; border-top:1px solid var(--color-neutral-300); display:flex; flex-direction:column; gap:6px\">\n                  <div style=\"display:flex; align-items:center; gap:10px; flex-wrap:wrap\">\n                    <span style=\"font-family:ui-monospace, monospace; font-size:12px; font-weight:600; color:var(--color-accent-800)\">{{ e.code }}<\u002Fspan>\n                    <span style=\"font-size:13.5px; font-weight:600; flex:1; min-width:120px\">{{ e.title }}<\u002Fspan>\n                    <span style=\"font-family:ui-monospace, monospace; font-size:11.5px; color:var(--color-neutral-600)\">{{ e.time }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <span style=\"font-size:12.5px; line-height:1.45; color:var(--color-neutral-700)\">{{ e.detail }}<\u002Fspan>\n                  <button class=\"btn btn-ghost\" style=\"align-self:flex-start\" sc-camel-on-click=\"{{ e.askAssistant }}\">Ask Sauce about this<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">Webhooks<\u002Fh2>\n              <p style=\"margin:0 0 8.8px; font-size:13.5px; color:var(--color-neutral-700)\">Inbound events the bridge listens for.<\u002Fp>\n              <sc-for list=\"{{ diagHooks }}\" as=\"h\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex; align-items:center; gap:13.2px; padding:11px 0; border-top:1px solid var(--color-neutral-300)\">\n                  <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:2px\">\n                    <span style=\"font-family:ui-monospace, monospace; font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ h.event }}<\u002Fspan>\n                    <span style=\"font-size:12px; color:var(--color-neutral-700)\">{{ h.detail }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <span class=\"tag {{ h.tag }}\" style=\"flex:none\">{{ h.state }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isNewChannel }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"New channel\" style=\"display:flex; flex-direction:column; gap:17.6px; max-width:820px\">\n          <div>\n            <span class=\"tag tag-accent\">Just connected<\u002Fspan>\n            <h1 style=\"font-family:var(--font-heading); font-weight:400; font-size:36px; line-height:1.15; margin:10px 0 0\">{{ newChannelName }}<\u002Fh1>\n            <p style=\"margin:8px 0 0; font-size:15px; line-height:1.55; color:var(--color-neutral-700)\">Connected and listening. It won't sell anything until its catalog is
