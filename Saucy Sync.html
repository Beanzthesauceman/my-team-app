  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

font-display: swap;\n  src: url(\"212ab577-a476-46df-b650-ebf765f25a59\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"a9ba5574-8311-44f2-9ce3-8921e6dd1aa1\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f5ead8;\n  --color-surface: #ebddc5;\n  --color-text: #201e1d;\n  --color-accent: #c67139;\n  --color-accent-2: #7a8a5e;\n  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f9f4ed;\n  --color-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 999px; }\n.input { padding-inline: 14px; }\n\n<\u002Fstyle>\n<script src=\"880595ea-d4e7-4edc-9b04-4a9c44ba20bc\"><\u002Fscript>\n<style>/* Project override on the bound Organic system: Saucy Streetwear keeps its\n   steel-blue accent on Organic's cream ground, and Pacifico is the brand's\n   signature display voice. Loaded AFTER the design system's own styles.css. */\n:root {\n  --color-accent: #5980a6;\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --font-heading: \"Pacifico\", \"Caprasimo\", cursive;\n  --font-heading-weight: 400;\n}\n<\u002Fstyle>\n<style>\n  html, body { margin: 0; padding: 0; background: var(--color-bg); }\n  a { color: var(--color-accent-700); text-decoration: none; }\n  a:hover { color: var(--color-accent); text-decoration: underline; }\n  *, *::before, *::after { box-sizing: border-box; }\n  .btn, .tag, .seg-opt { white-space: nowrap; }\n  .btn { border-radius: 999px; font-family: var(--font-body); font-weight: 600; }\n  .tag { border-radius: 999px; }\n  .pill-id { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"position:relative; display:flex; flex-direction:column; height:100vh; min-height:720px; font-family:var(--font-body); color:var(--color-text); background:var(--color-bg); overflow:hidden\">\n\n  <header style=\"display:flex; align-items:center; gap:26.4px; padding:0 26.4px; height:78px; flex:none; overflow:hidden\">\n    <div style=\"display:flex; align-items:baseline; gap:10px; flex:none; white-space:nowrap\">\n      <span style=\"font-family:var(--font-heading); font-size:27px; line-height:1; color:var(--color-accent-800)\">Saucy Sync<\u002Fspan>\n      <span style=\"font-size:11px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--color-accent-700)\">bridge<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; align-items:center; gap:8.8px; min-width:0; overflow:hidden\">\n      <div style=\"display:flex; align-items:center; gap:7px; padding:7px 14px; background:var(--color-surface); border-radius:999px; font-size:12.5px; white-space:nowrap; flex:0 1 auto; min-width:0\">\n        <span style=\"width:9px; height:9px; border-radius:999px; background:var(--color-accent); display:block; flex:none\"><\u002Fspan>\n        <span style=\"font-weight:600; flex:none\">GoDaddy<\u002Fspan>\n        <span class=\"pill-id\" style=\"color:var(--color-neutral-600)\">{{ domain }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:7px; padding:7px 14px; background:var(--color-surface); border-radius:999px; font-size:12.5px; white-space:nowrap; flex:0 1 auto; min-width:0\">\n        <span style=\"width:9px; height:9px; border-radius:999px; background:var(--color-accent-2); display:block; flex:none\"><\u002Fspan>\n        <span style=\"font-weight:600; flex:none\">Printify<\u002Fspan>\n        <span class=\"pill-id\" style=\"color:var(--color-neutral-600)\">shop_4471<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1; min-width:8px\"><\u002Fdiv>\n\n    <span class=\"pill-id\" style=\"display:{{ showSync }}; font-size:12.5px; color:var(--color-neutral-700); flex:0 1 auto\">{{ syncLabel }}<\u002Fspan>\n    <button class=\"btn btn-primary\" style=\"display:{{ showSync }}; flex:none; padding:11px 22px; font-weight:600\" sc-camel-on-click=\"{{ runSync }}\">{{ syncButtonLabel }}<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ toggleAccountMenu }}\" style=\"display:flex; align-items:center; gap:9px; flex:none; font:inherit; cursor:pointer; padding:5px 14px 5px 5px; border:0; border-radius:999px; background:var(--color-surface)\">\n      <span style=\"width:32px; height:32px; flex:none; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; background:{{ meDotBg }}; color:{{ meDotFg }}\">{{ meInitial }}<\u002Fspan>\n      <span style=\"display:flex; flex-direction:column; align-items:flex-start\">\n        <span style=\"font-size:13px; font-weight:600; line-height:1.2\">{{ meName }}<\u002Fspan>\n        <span style=\"font-size:11px; color:var(--color-neutral-700); line-height:1.2\">{{ meRole }}<\u002Fspan>\n      <\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ accountMenuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute; top:70px; right:26.4px; z-index:40; width:290px; background:var(--color-surface); border-radius:28px; padding:22px; box-shadow:var(--shadow-lg); display:flex; flex-direction:column; gap:13.2px\">\n      <div style=\"display:flex; align-items:center; gap:12px\">\n        <span style=\"width:44px; height:44px; flex:none; border-radius:999px; display:flex; align-items:center; justify-content:center; font-family:var(--font-heading); font-size:18px; background:{{ meDotBg }}; color:{{ meDotFg }}\">{{ meInitial }}<\u002Fspan>\n        <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:2px\">\n          <span style=\"font-size:15px; font-weight:600\">{{ meName }}<\u002Fspan>\n          <span style=\"font-family:ui-monospace, monospace; font-size:11.5px; color:var(--color-neutral-700); overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ meEmail }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-wrap:wrap; gap:6px\">\n        <span class=\"tag tag-accent\">{{ meRole }}<\u002Fspan>\n        <span class=\"tag tag-neutral\">2FA on<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"font-size:12.5px; line-height:1.5; color:var(--color-neutral-700); border-top:1px solid var(--color-neutral-300); padding-top:13.2px\">{{ meScope }}<\u002Fspan>\n      <div style=\"display:flex; flex-direction:column; gap:8px\">\n        <button class=\"btn btn-secondary btn-block\" style=\"margin:0\" sc-camel-on-click=\"{{ signOut }}\">Switch account<\u002Fbutton>\n        <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ signOut }}\">Sign out<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:flex; flex:1; min-height:0; padding:0 26.4px 26.4px; gap:26.4px\">\n\n    <nav style=\"width:240px; flex:none; display:flex; flex-direction:column; gap:4px; padding:4px 0 17.6px; overflow-y:auto\">\n      <div class=\"seg\" style=\"margin:0 4px 8.8px; align-self:stretch; flex:none\">\n        <sc-for list=\"{{ modes }}\" as=\"m\" hint-placeholder-count=\"2\">\n          <label class=\"seg-opt\" style=\"flex:1; justify-content:center; background:{{ m.bg }}; color:{{ m.fg }}\">\n            <input type=\"radio\" name=\"navmode\" sc-camel-on-change=\"{{ m.pick }}\">\n            <span>{{ m.label }}<\u002Fspan>\n          <\u002Flabel>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-for list=\"{{ navGroups }}\" as=\"g\" hint-placeholder-count=\"5\">\n        <div style=\"display:flex; flex-direction:column; gap:3px; padding-bottom:13.2px\">\n          <span style=\"font-size:10.5px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--color-neutral-600); padding:8.8px 18px 6px\">{{ g.label }}<\u002Fspan>\n          <sc-for list=\"{{ g.items }}\" as=\"item\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ item.go }}\" style=\"display:flex; align-items:center; gap:10px; width:100%; text-align:left; font:inherit; font-size:14.5px; cursor:pointer; padding:9px 18px; border:0; border-radius:999px; background:{{ item.bg }}; color:{{ item.fg }}; font-weight:{{ item.fw }}\" style-hover=\"background:var(--color-surface)\">\n              <span style=\"flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ item.label }}<\u002Fspan>\n              <span style=\"font-size:11.5px; opacity:0.7; flex:none\">{{ item.count }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"font-size:12.5px; line-height:1.5; color:var(--color-neutral-700); padding:17.6px; background:var(--color-surface); border-radius:28px; margin-top:8.8px\">\n        Everything you sell through, in one place. The bridge does the paste-work.\n      <\u002Fdiv>\n    <\u002Fnav>\n\n    <main style=\"flex:1; min-width:0; overflow-y:auto; padding:8.8px 4px 26.4px\">\n\n      <sc-if value=\"{{ isDash }}\" hint-placeholder-val=\"{{ true }}\">\n        <div data-screen-label=\"Command center — Full board\" style=\"display:flex; flex-direction:column; gap:17.6px\">\n          <div class=\"seg\" style=\"align-self:flex-start; flex:none\">\n            <sc-for list=\"{{ dashTabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n              <label class=\"seg-opt\" style=\"background:{{ t.bg }}; color:{{ t.fg }}\">\n                <input type=\"radio\" name=\"dashtab\" sc-camel-on-change=\"{{ t.pick }}\">\n                <span>{{ t.label }}<\u002Fspan>\n              <\u002Flabel>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div>\n            <h1 style=\"font-family:var(--font-heading); font-weight:400; font-size:40px; line-height:1.15; margin:0\">{{ greeting }}<\u002Fh1>\n            <p style=\"margin:10px 0 0; font-size:15.5px; line-height:1.6; max-width:60ch; color:var(--color-neutral-700)\">{{ dashSub }}<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"display:{{ showMoney }}; background:var(--color-surface); border-radius:28px; padding:26.4px\">\n            <div style=\"display:flex; align-items:flex-end; gap:17.6px; flex-wrap:wrap; margin-bottom:17.6px\">\n              <div style=\"display:flex; flex-direction:column; gap:2px\">\n                <span style=\"font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700)\">Money in · last 7 days<\u002Fspan>\n                <span style=\"font-family:var(--font-heading); font-weight:400; font-size:44px; line-height:1.2\">{{ moneyTotal }}<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"font-size:13.5px; color:var(--color-neutral-700); padding-bottom:8px\">{{ moneyDelta }}<\u002Fspan>\n              <span style=\"flex:1\"><\u002Fspan>\n              <div class=\"seg\" style=\"align-self:flex-end\">\n                <sc-for list=\"{{ ranges }}\" as=\"r\" hint-placeholder-count=\"3\">\n                  <label class=\"seg-opt\" style=\"background:{{ r.bg }}; color:{{ r.fg }}\">\n                    <input type=\"radio\" name=\"range\" sc-camel-on-change=\"{{ r.pick }}\">\n                    <span>{{ r.label }}<\u002Fspan>\n                  <\u002Flabel>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:13.2px\">\n              <sc-for list=\"{{ channelMoney }}\" as=\"c\" hint-placeholder-count=\"5\">\n                <div style=\"background:var(--color-bg); border-radius:16px; padding:14px 17.6px; display:flex; flex-direction:column; gap:8px\">\n                  <div style=\"display:flex; align-items:center; gap:8px\">\n                    <span style=\"width:9px; height:9px; border-radius:999px; flex:none; background:{{ c.dot }}\"><\u002Fspan>\n                    <span style=\"font-size:13.5px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ c.name }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <span style=\"font-family:ui-monospace, monospace; font-size:19px; font-weight:600\">{{ c.amount }}<\u002Fspan>\n                  <span style=\"height:6px; border-radius:999px; background:var(--color-neutral-300); display:block; overflow:hidden\">\n                    <span style=\"display:block; height:6px; border-radius:999px; background:{{ c.dot }}; width:{{ c.share }}\"><\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"font-size:12px; color:var(--color-neutral-700)\">{{ c.note }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(420px,1fr)); gap:17.6px; align-items:start\">\n            <div style=\"display:{{ showDecisions }}; flex-direction:column; background:var(--color-surface); border-radius:28px; padding:26.4px; outline:{{ hlDecisions }}; outline-offset:4px\">\n              <div style=\"display:flex; align-items:baseline; gap:10px; margin-bottom:4px\">\n                <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0; font-size:24px\">Needs you today<\u002Fh2>\n                <span class=\"tag tag-accent\">{{ decisionCount }}<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"margin:0 0 8.8px; font-size:13.5px; color:var(--color-neutral-700)\">Everything else the bridge handled on its own.<\u002Fp>\n              <sc-for list=\"{{ decisions }}\" as=\"d\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex; align-items:center; gap:13.2px; padding:12px 0; border-top:1px solid var(--color-neutral-300)\">\n                  <span style=\"width:38px; height:38px; flex:none; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; background:{{ d.dotBg }}; color:{{ d.dotFg }}\">{{ d.badge }}<\u002Fspan>\n                  <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:2px\">\n                    <span style=\"font-size:14.5px; font-weight:600\">{{ d.title }}<\u002Fspan>\n                    <span style=\"font-size:12.5px; line-height:1.4; color:var(--color-neutral-700)\">{{ d.detail }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <button class=\"btn btn-secondary\" style=\"flex:none; padding:8px 16px; font-size:13px\" sc-camel-on-click=\"{{ d.act }}\">{{ d.action }}<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ decisionsClear }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border-top:1px solid var(--color-neutral-300); padding:26.4px 0 4px; text-align:center\">\n                  <span style=\"font-family:var(--font-heading); font-weight:400; font-size:22px\">Nothing waiting. Go make something.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px; outline:{{ hlMedia }}; outline-offset:4px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">Media inbox<\u002Fh2>\n              <p style=\"margin:0 0 17.6px; font-size:13.5px; line-height:1.5; color:var(--color-neutral-700)\">Drop what you made elsewhere. Tell it once where the file belongs and the bridge distributes it.<\u002Fp>\n              <sc-if value=\"{{ hasMedia }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"background:var(--color-bg); border-radius:16px; padding:17.6px; display:flex; flex-direction:column; gap:13.2px\">\n                  <div style=\"display:flex; align-items:center; gap:13.2px\">\n                    <span style=\"width:56px; height:56px; flex:none; border-radius:16px; background:var(--color-neutral-300); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; color:var(--color-neutral-700)\">{{ mediaKind }}<\u002Fspan>\n                    <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:3px\">\n                      <span style=\"font-family:ui-monospace, monospace; font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ mediaName }}<\u002Fspan>\n                      <span style=\"font-size:12px; color:var(--color-neutral-700)\">{{ mediaMeta }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <span style=\"font-size:12px; color:var(--color-neutral-600); flex:none\">{{ mediaQueue }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <span style=\"font-size:12.5px; font-weight:600\">Where should this go?<\u002Fspan>\n                  <div style=\"display:flex; flex-wrap:wrap; gap:8px\">\n                    <sc-for list=\"{{ routeOptions }}\" as=\"r\" hint-placeholder-count=\"6\">\n                      <button sc-camel-on-click=\"{{ r.toggle }}\" style=\"font:inherit; font-size:13px; cursor:pointer; padding:8px 15px; border-radius:999px; border:1px solid {{ r.bc }}; background:{{ r.bg }}; color:{{ r.fg }}\">{{ r.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"display:flex; gap:8.8px; align-items:center\">\n                    <button class=\"btn btn-primary\" style=\"padding:10px 20px\" disabled=\"{{ routeDisabled }}\" sc-camel-on-click=\"{{ routeMedia }}\">{{ routeLabel }}<\u002Fbutton>\n                    <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ skipMedia }}\">Skip<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ mediaEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"background:var(--color-bg); border-radius:16px; padding:35.2px 17.6px; text-align:center; display:flex; flex-direction:column; gap:6px\">\n                  <span style=\"font-family:var(--font-heading); font-weight:400; font-size:22px\">Inbox clear<\u002Fspan>\n                  <span style=\"font-size:13px; color:var(--color-neutral-700)\">{{ routedSummary }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:{{ showFanout }}; flex-direction:column; background:var(--color-surface); border-radius:28px; padding:26.4px; outline:{{ hlFanout }}; outline-offset:4px\">\n            <div style=\"display:flex; align-items:center; gap:13.2px; flex-wrap:wrap; margin-bottom:4px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0; font-size:24px\">Change fan-out<\u002Fh2>\n              <span class=\"tag {{ autoTag }}\">{{ autoBadge }}<\u002Fspan>\n              <span style=\"flex:1\"><\u002Fspan>\n              <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ goAutoSync }}\">Rules<\u002Fbutton>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 8.8px; font-size:13.5px; line-height:1.5; color:var(--color-neutral-700)\">Anything that changes on any channel, the site or Printify gets pushed everywhere else. Held items wait for you.<\u002Fp>\n            <sc-for list=\"{{ fanFeed }}\" as=\"f\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex; align-items:center; gap:13.2px; padding:11px 0; border-top:1px solid var(--color-neutral-300); flex-wrap:wrap\">\n                <span style=\"font-family:ui-monospace, monospace; font-size:11.5px; color:var(--color-neutral-600); flex:none; width:64px\">{{ f.time }}<\u002Fspan>\n                <div style=\"flex:1; min-width:180px; display:flex; flex-direction:column; gap:2px\">\n                  <span style=\"font-size:14px; font-weight:600\">{{ f.what }}<\u002Fspan>\n                  <span style=\"font-size:12.5px; line-height:1.4; color:var(--color-neutral-700)\">{{ f.source }} → {{ f.targets }}<\u002Fspan>\n                <\u002Fdiv>\n                <span class=\"tag {{ f.tag }}\" style=\"flex:none\">{{ f.state }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:{{ showPipeline }}; flex-direction:column; background:var(--color-surface); border-radius:28px; padding:26.4px; outline:{{ hlPipeline }}; outline-offset:4px\">\n            <div style=\"display:flex; align-items:center; gap:13.2px; flex-wrap:wrap; margin-bottom:4px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0; font-size:24px\">GoDaddy ⇄ Printify<\u002Fh2>\n              <span class=\"tag tag-accent-2\">All four legs live<\u002Fspan>\n              <span style=\"flex:1\"><\u002Fspan>\n              <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ goPrintify }}\">Open production<\u002Fbutton>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 8.8px; font-size:13.5px; color:var(--color-neutral-700)\">The original job: your store takes the order, Printify makes and ships it, the buyer gets tracking. Nobody pastes a SKU.<\u002Fp>\n            <sc-for list=\"{{ pipeline }}\" as=\"p\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex; align-items:center; gap:13.2px; padding:12px 0; border-top:1px solid var(--color-neutral-300)\">\n                <span style=\"width:30px; height:30px; flex:none; border-radius:999px; background:var(--color-accent); color:var(--color-bg); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700\">{{ p.leg }}<\u002Fspan>\n                <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:2px\">\n                  <span style=\"font-size:14.5px; font-weight:600\">{{ p.name }}<\u002Fspan>\n                  <span style=\"font-size:12.5px; line-height:1.4; color:var(--color-neutral-700)\">{{ p.detail }}<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-family:ui-monospace, monospace; font-size:12px; color:var(--color-neutral-600); flex:none\">{{ p.time }}<\u002Fspan>\n                <span class=\"tag {{ p.tag }}\" style=\"flex:none\">{{ p.state }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(420px,1fr)); gap:17.6px; align-items:start\">\n            <div style=\"display:{{ showChannels }}; flex-direction:column; background:var(--color-surface); border-radius:28px; padding:26.4px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">Channel health<\u002Fh2>\n              <p style=\"margin:0 0 8.8px; font-size:13.5px; color:var(--color-neutral-700)\">Five places to sell, one place to watch them.<\u002Fp>\n              <sc-for list=\"{{ channelHealth }}\" as=\"c\" hint-placeholder-count=\"5\">\n                <div style=\"display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:13.2px; padding:11px 0; border-top:1px solid var(--color-neutral-300)\">\n                  <div style=\"display:flex; flex-direction:column; gap:2px; min-width:0\">\n                    <span style=\"font-size:14.5px; font-weight:600\">{{ c.name }}<\u002Fspan>\n                    <span style=\"font-size:12.5px; line-height:1.4; color:var(--color-neutral-700)\">{{ c.detail }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <span style=\"font-family:ui-monospace, monospace; font-size:12px; color:var(--color-neutral-600)\">{{ c.time }}<\u002Fspan>\n                  <span class=\"tag {{ c.tag }}\">{{ c.state }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">Next up<\u002Fh2>\n              <p style=\"margin:0 0 8.8px; font-size:13.5px; color:var(--color-neutral-700)\">Posting, dropping and going live this week.<\u002Fp>\n              <sc-for list=\"{{ upcoming }}\" as=\"u\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex; gap:13.2px; padding:11px 0; border-top:1px solid var(--color-neutral-300)\">\n                  <div style=\"width:52px; flex:none; display:flex; flex-direction:column\">\n                    <span style=\"font-size:12px; font-weight:700; color:var(--color-accent-700)\">{{ u.day }}<\u002Fspan>\n                    <span style=\"font-family:ui-monospace, monospace; font-size:11.5px; color:var(--color-neutral-600)\">{{ u.time }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:2px\">\n                    <span style=\"font-size:14.5px; font-weight:600\">{{ u.title }}<\u002Fspan>\n                    <span style=\"font-size:12.5px; line-height:1.4; color:var(--color-neutral-700)\">{{ u.where }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <span class=\"tag {{ u.tag }}\" style=\"flex:none; align-self:flex-start\">{{ u.state }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:{{ showOps }}; grid-template-columns:repeat(auto-fit, minmax(420px,1fr)); gap:17.6px; align-items:start\">\n            <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">Running out<\u002Fh2>\n              <p style=\"margin:0 0 8.8px; font-size:13.5px; color:var(--color-neutral-700)\">Blanks the provider is short on, or nearly.<\u002Fp>\n              <sc-for list=\"{{ lowStock }}\" as=\"s\" hint-placeholder-count=\"4\">\n                <div style=\"display:grid; grid-template-columns:1fr 72px auto; align-items:center; gap:13.2px; padding:10px 0; border-top:1px solid var(--color-neutral-300)\">\n                  <div style=\"display:flex; flex-direction:column; gap:2px; min-width:0\">\n                    <span style=\"font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ s.name }}<\u002Fspan>\n                    <span style=\"font-size:12px; color:var(--color-neutral-700)\">{{ s.where }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <span style=\"font-family:ui-monospace, monospace; font-size:13px; font-weight:600; color:{{ s.numColor }}\">{{ s.left }}<\u002Fspan>\n                  <span class=\"tag {{ s.tag }}\">{{ s.state }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"background:var(--color-surface); border-radius:28px; padding:26.4px\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0 0 4px; font-size:24px\">Sites &amp; domains<\u002Fh2>\n              <p style=\"margin:0 0 8.8px; font-size:13.5px; color:var(--color-neutral-700)\">Uptime, certificates and renewals across both brands ckground:var(--color-surface); border-radius:28px; padding:22px; display:flex; flex-direction:column; gap:6px\">\n                <span style=\"font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700)\">{{ s.label }}<\u002Fspan>\n                <span style=\"font-family:var(--font-heading); font-weight:400; font-size:38px; line-height:1.25\">{{ s.value }}<\u002Fspan>\n                <span style=\"font-size:12.5px; color:var(--color-neutral-700)\">{{ s.note }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"background:var(--color-surface); border-radius:28px; padding:8.8px 0; overflow-x:auto\">\n            <div style=\"padding:13.2px 26.4px 4px; display:flex; align-items:center; gap:13.2px; flex-wrap:wrap\">\n              <h2 style=\"font-family:var(--font-heading); font-weight:400; margin:0; font-size:24px\">Listings<\u002Fh2>\n              <span style=\"flex:1\"><\u002Fspan>\n              <button class=\"btn btn-secondary\" style=\"padding:8px 16px; font-size:13px\" sc-camel-on-click=\"{{ goProducts }}\">Full mapping<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:minmax(190px,2fr) 100px 84px 72px 112px 92px; gap:13.2px; padding:8px 26.4px 10px; min-width:840px; font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700); white-space:nowrap\">\n              <span>Listing<\u002Fspan><span>SKU<\u002Fspan><span>Price<\u002Fspan><span>Stock<\u002Fspan><span>State<\u002Fspan><span>Last push<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ gdListings }}\" as=\"l\" hint-placeholder-count=\"6\">\n              <div style=\"display:grid; grid-template-columns:minmax(190px,2fr) 100px 84px 72px 112px 92px; gap:13.2px; align-items:center; padding:9px 26.4px; min-width:840px; border-top:1px solid var(--color-neutral-300); font-size:
